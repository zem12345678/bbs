apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bbs-production

resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml

configMapGenerator:
  - name: bbs-web-runtime
    files:
      - config.js=bbs-web-config.js

# Replace every example name and tag with an image immutable digest before use.
images:
  - name: registry.example.invalid/bbs-api-gateway
    newName: ghcr.io/your-org/bbs-api-gateway
    newTag: replace-me
  - name: registry.example.invalid/bbs-admin-service
    newName: ghcr.io/your-org/bbs-admin-service
    newTag: replace-me
  - name: registry.example.invalid/bbs-chat-service
    newName: ghcr.io/your-org/bbs-chat-service
    newTag: replace-me
  - name: registry.example.invalid/bbs-comment-service
    newName: ghcr.io/your-org/bbs-comment-service
    newTag: replace-me
  - name: registry.example.invalid/bbs-content-service
    newName: ghcr.io/your-org/bbs-content-service
    newTag: replace-me
  - name: registry.example.invalid/bbs-credit-service
    newName: ghcr.io/your-org/bbs-credit-service
    newTag: replace-me
  - name: registry.example.invalid/bbs-feed-service
    newName: ghcr.io/your-org/bbs-feed-service
    newTag: replace-me
  - name: registry.example.invalid/bbs-file-service
    newName: ghcr.io/your-org/bbs-file-service
    newTag: replace-me
  - name: registry.example.invalid/bbs-mall-service
    newName: ghcr.io/your-org/bbs-mall-service
    newTag: replace-me
  - name: registry.example.invalid/bbs-notification-service
    newName: ghcr.io/your-org/bbs-notification-service
