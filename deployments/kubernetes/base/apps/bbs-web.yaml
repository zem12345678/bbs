apiVersion: v1
kind: Service
metadata:
  name: bbs-web
  labels:
    app.kubernetes.io/name: bbs-web
    app.kubernetes.io/part-of: bbs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bbs-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bbs-web
  labels:
    app.kubernetes.io/name: bbs-web
    app.kubernetes.io/part-of: bbs
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bbs-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bbs-web
        app.kubernetes.io/part-of: bbs
    spec:
      securityContext:
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: registry.example.invalid/bbs-web:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: runtime
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
      volumes:
        - name: runtime
          emptyDir: {}
