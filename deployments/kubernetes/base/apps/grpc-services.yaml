spec:
  replicas: 1
  # Snowflake worker IDs are static until an instance allocator exists. Recreate
  # prevents a rolling-update overlap with the same worker ID.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bbs-chat-service
