# TCP probes deliberately avoid an unauthenticated plaintext gRPC call.
# Replace them with certificate-aware gRPC health probes when mTLS is enabled
# on a service.
apiVersion: v1
kind: Service
metadata:
  name: bbs-user-service
  labels:
    app.kubernetes.io/name: bbs-user-service
    app.kubernetes.io/part-of: bbs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bbs-user-service
  ports:
    - name: grpc
      port: 9102
      protocol: TCP
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bbs-user-service
  labels:
    app.kubernetes.io/name: bbs-user-service
    app.kubernetes.io/part-of: bbs
spec:
  replicas: 1
  # Snowflake worker IDs are static until an instance allocator exists. Recreate
  # prevents an old and new user Pod from issuing IDs concurrently.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bbs-user-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bbs-user-service
        app.kubernetes.io/part-of: bbs
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service
          image: registry.example.invalid/bbs-user-service:replace-me
          imagePullPolicy: IfNotPresent
          args: ["server", "-c", "/app/config/config.yaml"]
          env:
            # Pin production validation outside the mutable runtime Secret.
            - name: BBS_USER_TRACE_ENV
              value: "production"
            # Runtime Secrets are complete immutable startup configuration;
            # do not make production availability depend on Nacos.
            - name: BBS_USER_SKIP_NACOS
              value: "true"
          ports:
            - name: grpc
              containerPort: 9102
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: runtime-config
              mountPath: /app/config/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: runtime
              mountPath: /tmp
          startupProbe:
            tcpSocket:
              port: grpc
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 20
      volumes:
        - name: runtime-config
          secret:
            secretName: bbs-user-service-runtime
        - name: runtime
          emptyDir: {}
---
