            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: runtime-config
              mountPath: /app/config/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: grpc-server-tls
