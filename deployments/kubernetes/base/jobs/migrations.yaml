          image: registry.example.invalid/bbs-chat-service:replace-me
          imagePullPolicy: IfNotPresent
          args: ["migrate", "-c", "/app/config/config.yaml"]
          # The production config loader requires an explicit Chat worker ID
          # even for the migration command. This value is not used to serve
          # traffic; the Deployment supplies the same single-replica ID.
          env:
            - name: BBS_CHAT_TRACE_ENV
              value: "production"
            - name: BBS_CHAT_SKIP_NACOS
              value: "true"
            - name: BBS_CHAT_SNOWFLAKE_WORKER_ID
              value: "16"
            - name: BBS_CHAT_GRPC_SERVER_TLS_ENABLED
              value: "true"
            - name: BBS_CHAT_GRPC_SERVER_TLS_CERT_FILE
              value: "/app/tls/tls.crt"
