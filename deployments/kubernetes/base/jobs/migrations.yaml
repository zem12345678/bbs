apiVersion: batch/v1
kind: Job
metadata:
  name: bbs-admin-service-migrate
  labels:
    app.kubernetes.io/name: bbs-admin-service
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: bbs
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bbs-admin-service
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: bbs
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: registry.example.invalid/bbs-admin-service:replace-me
          imagePullPolicy: IfNotPresent
          args: ["migrate", "-c", "/app/config/config.yaml"]
          # Config validation is shared with the server command, so migration
          # Jobs receive the same production mTLS settings and read-only files.
          env:
            - name: BBS_ADMIN_TRACE_ENV
              value: "production"
            - name: BBS_ADMIN_SKIP_NACOS
              value: "true"
            - name: BBS_ADMIN_GRPC_SERVER_TLS_ENABLED
              value: "true"
            - name: BBS_ADMIN_GRPC_SERVER_TLS_CERT_FILE
              value: "/app/tls/tls.crt"
            - name: BBS_ADMIN_GRPC_SERVER_TLS_KEY_FILE
              value: "/app/tls/tls.key"
            - name: BBS_ADMIN_GRPC_SERVER_TLS_CLIENT_CA_FILE
              value: "/app/tls/ca.crt"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: runtime-config
              mountPath: /app/config/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: grpc-server-tls
              mountPath: /app/tls
              readOnly: true
            - name: runtime
              mountPath: /tmp
      volumes:
        - name: runtime-config
          secret:
            secretName: bbs-admin-service-runtime
        - name: grpc-server-tls
          secret:
            secretName: bbs-admin-service-grpc-server-tls
            defaultMode: 288
        - name: runtime
          emptyDir: {}
---
