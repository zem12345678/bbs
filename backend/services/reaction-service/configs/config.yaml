service:
  name: bbs-reaction-service
  grpcPort: 9105

app:
  name: bbs-reaction-service

nacos:
  addr: "127.0.0.1"
  port: 8848
  namespaceId: bbs-local
  dataId: "bbs-reaction-service.yaml"
  groupId: "BBS_LOCAL"

log:
  filename: logs/reaction-service.log
  maxSize: 100
  maxBackups: 7
  maxAge: 30
  level: debug
  stdout: true

trace:
  grpcEndpoint: 127.0.0.1:4317
  serviceName: bbs-reaction-service
  version: local
  env: local

grpc:
  server:
    port: 9105
    etcdAddr:
      - "127.0.0.1:2379"
    serviceName: "bbs-reaction-service"
    timeout: 10s

redis:
  # Override in production with BBS_REACTION_REDIS_ADDR and BBS_REACTION_REDIS_PASSWORD.
  url: 127.0.0.1:6379
  addr: 127.0.0.1:6379
  dbNum: 0
  db: 0
  password: ""
  maxIdle: 10
  maxActive: 100
  idleTimeout: 10
  timeout: 5
  network: "tcp"

postgres:
  # Override in production with BBS_REACTION_POSTGRES_DSN.
  dsn: postgres://bbs_reaction_app:local_reaction_pass@127.0.0.1:5432/bbs?sslmode=disable&search_path=bbs_reaction
  debug: false
  max_open_conns: 1

kafka:
  # Override in production with comma-separated BBS_REACTION_KAFKA_BROKERS.
  brokers:
    - 127.0.0.1:9092
  topic: reaction.events

reaction:
  rebuildCacheOnStart: true
