syntax = "proto3";

package bbs.reaction.v1;

option go_package = "reaction-service/api/proto/reactionpb;reactionpb";

service ReactionService {
  rpc Like(ReactRequest) returns (ReactResponse);
  rpc Unlike(ReactRequest) returns (ReactResponse);
  rpc ListLikes(ListLikesRequest) returns (LikeListResponse);
  rpc Favorite(ReactRequest) returns (ReactResponse);
  rpc Unfavorite(ReactRequest) returns (ReactResponse);
  rpc ListFavorites(ListFavoritesRequest) returns (FavoriteListResponse);
  rpc GetCounts(EntityRequest) returns (CountsResponse);
  rpc HotIDs(HotIDsRequest) returns (HotIDsResponse);
  rpc SubmitReport(SubmitReportRequest) returns (ReportResponse);
  rpc ListReports(ListReportsRequest) returns (ReportListResponse);
  rpc GetReport(GetReportRequest) returns (ReportResponse);
  rpc AuditReport(AuditReportRequest) returns (ReportResponse);
  rpc CreateCollection(CreateCollectionRequest) returns (CollectionResponse);
  rpc UpdateCollection(UpdateCollectionRequest) returns (CollectionResponse);
  rpc DeleteCollection(DeleteCollectionRequest) returns (CollectionActionResponse);
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
  rpc AddCollectionItem(CollectionItemRequest) returns (CollectionActionResponse);
  rpc RemoveCollectionItem(CollectionItemRequest) returns (CollectionActionResponse);
  rpc ListCollectionItems(ListCollectionItemsRequest) returns (CollectionItemsResponse);
  rpc GetCollection(GetCollectionRequest) returns (CollectionResponse);
  rpc ListPublicCollectionItems(ListPublicCollectionItemsRequest) returns (CollectionItemsResponse);
  rpc ListPublicCollections(ListPublicCollectionsRequest) returns (ListCollectionsResponse);
  rpc ListPublicCollectionsForEntity(ListPublicCollectionsForEntityRequest) returns (ListCollectionsResponse);
  rpc EraseAccountReactions(EraseAccountReactionsRequest) returns (EraseAccountReactionsResponse);
}

message EntityRef {
  string entity_type = 1;
  int64 entity_id = 2;
}

message ReactRequest {
  EntityRef entity = 1;
  int64 user_id = 2;
}

message ReactResponse {
  bool success = 1;
  string message = 2;
  int64 count = 3;
  bool changed = 4;
}

message EntityRequest {
  EntityRef entity = 1;
}

message CountsResponse {
  int64 like_count = 1;
  int64 favorite_count = 2;
}

message LikeInfo {
  int64 id = 1;
  EntityRef entity = 2;
  int64 user_id = 3;
  int64 created_at = 4;
  int64 updated_at = 5;
}

message ListLikesRequest {
  int64 user_id = 1;
  string entity_type = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message LikeListResponse {
  repeated LikeInfo items = 1;
  int64 total = 2;
}

message FavoriteInfo {
  int64 id = 1;
  EntityRef entity = 2;
  int64 user_id = 3;
  int64 created_at = 4;
  int64 updated_at = 5;
}

message ListFavoritesRequest {
  int64 user_id = 1;
  string entity_type = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message FavoriteListResponse {
  repeated FavoriteInfo items = 1;
  int64 total = 2;
}

message HotIDsRequest {
  string entity_type = 1;
  int32 limit = 2;
}

message HotIDsResponse {
  repeated int64 ids = 1;
}

message SubmitReportRequest {
  EntityRef entity = 1;
  int64 reporter_id = 2;
  string reason = 3;
  string description = 4;
}

message ReportInfo {
  int64 id = 1;
  EntityRef entity = 2;
  int64 reporter_id = 3;
  string reason = 4;
  string description = 5;
  int32 status = 6;
  int64 handled_by = 7;
  int64 handled_at = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
  string audit_note = 11;
  string target_action = 12;
}

message ReportResponse {
  bool success = 1;
  string message = 2;
  ReportInfo report = 3;
  bool created = 4;
}

message ListReportsRequest {
  int32 status = 1;
  int32 limit = 2;
  int32 offset = 3;
  string entity_type = 4;
}

message ReportListResponse {
  repeated ReportInfo items = 1;
  int64 total = 2;
}

message GetReportRequest {
  int64 id = 1;
}

message AuditReportRequest {
  int64 id = 1;
  int32 status = 2;
  int64 handler_id = 3;
  string audit_note = 4;
  string target_action = 5;
}

message CollectionInfo {
  int64 id = 1;
  int64 user_id = 2;
  string name = 3;
  string description = 4;
  bool is_public = 5;
  int64 item_count = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
  int64 last_clipped_at = 9;
}

message CollectionItemInfo {
  int64 id = 1;
  int64 collection_id = 2;
  EntityRef entity = 3;
  int64 created_at = 4;
}

message CreateCollectionRequest {
  int64 user_id = 1;
  string name = 2;
  string description = 3;
  bool is_public = 4;
}

message UpdateCollectionRequest {
  int64 user_id = 1;
  int64 id = 2;
  string name = 3;
  string description = 4;
  bool is_public = 5;
}

message DeleteCollectionRequest {
  int64 user_id = 1;
  int64 id = 2;
}

message ListCollectionsRequest {
  int64 user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
  int64 after_id = 4;
  bool ascending_by_id = 5;
}

message CollectionItemRequest {
  int64 user_id = 1;
  int64 collection_id = 2;
  EntityRef entity = 3;
}

message ListCollectionItemsRequest {
  int64 user_id = 1;
  int64 collection_id = 2;
  string entity_type = 3;
  int32 limit = 4;
  int32 offset = 5;
  int64 after_id = 6;
  bool ascending_by_id = 7;
}

message GetCollectionRequest {
  int64 id = 1;
  int64 viewer_user_id = 2;
}

message ListPublicCollectionItemsRequest {
  int64 collection_id = 1;
  int32 limit = 2;
  int32 offset = 3;
  int64 viewer_user_id = 4;
}

message ListPublicCollectionsRequest {
  int64 user_id = 1;
  int32 limit = 2;
  int64 since_id = 3;
  int64 until_id = 4;
  int64 viewer_user_id = 5;
}

message ListPublicCollectionsForEntityRequest {
  EntityRef entity = 1;
  int32 limit = 2;
  int64 viewer_user_id = 3;
}

message CollectionResponse {
  bool success = 1;
  string message = 2;
  CollectionInfo collection = 3;
}

message CollectionActionResponse {
  bool success = 1;
  string message = 2;
  bool changed = 3;
}

message ListCollectionsResponse {
  repeated CollectionInfo items = 1;
  int64 total = 2;
}

message CollectionItemsResponse {
  repeated CollectionItemInfo items = 1;
  int64 total = 2;
}

message EraseAccountReactionsRequest {
  int64 user_id = 1;
  int64 deletion_job_id = 2;
  int32 policy_version = 3;
}

message EraseAccountReactionsResponse {
  bool completed = 1;
  int64 deleted_likes = 2;
  int64 deleted_favorites = 3;
  int64 deleted_collections = 4;
  int64 anonymized_reports = 5;
  int64 anonymized_handled_reports = 6;
}
