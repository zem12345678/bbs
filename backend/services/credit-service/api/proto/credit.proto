syntax = "proto3";

package bbs.credit.v1;

option go_package = "credit-service/api/proto/creditpb;creditpb";

service CreditService {
  rpc GetBalance(GetBalanceRequest) returns (BalanceResponse);
  rpc ListLedger(ListLedgerRequest) returns (ListLedgerResponse);
  rpc ListLeaderboard(ListLeaderboardRequest) returns (ListLeaderboardResponse);
  rpc GetCheckInStatus(GetCheckInStatusRequest) returns (CheckInStatusResponse);
  rpc CheckIn(CheckInRequest) returns (CheckInResponse);
  rpc GetTaskClaimStatus(GetTaskClaimStatusRequest) returns (TaskClaimStatusResponse);
  rpc ListTaskClaimStatuses(ListTaskClaimStatusesRequest) returns (ListTaskClaimStatusesResponse);
  rpc ClaimTask(ClaimTaskRequest) returns (ClaimTaskResponse);
  rpc DebitCredits(DebitCreditsRequest) returns (DebitCreditsResponse);
  rpc AdjustCredits(AdjustCreditsRequest) returns (AdjustCreditsResponse);
  rpc TransferCredits(TransferCreditsRequest) returns (TransferCreditsResponse);
  rpc ReserveCredits(ReserveCreditsRequest) returns (ReserveCreditsResponse);
  rpc ReleaseCredits(ReleaseCreditsRequest) returns (ReleaseCreditsResponse);
  rpc ReverseQAAcceptance(ReverseQAAcceptanceRequest) returns (ReverseQAAcceptanceResponse);
  rpc EraseUserData(EraseUserDataRequest) returns (EraseUserDataResponse);
}

message Balance {
  int64 user_id = 1;
  int64 total = 2;
  int64 updated_at = 3;
}

message LedgerEntry {
  int64 id = 1;
  int64 user_id = 2;
  int64 delta = 3;
  int64 balance_after = 4;
  string reason = 5;
  string description = 6;
  string source_event_id = 7;
  string source_type = 8;
  int64 source_id = 9;
  int64 created_at = 10;
}

message LeaderboardEntry {
  int64 user_id = 1;
  int64 total = 2;
  int32 rank = 3;
}

message DailyCheckIn {
  int64 id = 1;
  int64 user_id = 2;
  string latest_day = 3;
  int32 consecutive_days = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
}

message CreditReservation {
  int64 id = 1;
  int64 user_id = 2;
  int64 amount = 3;
  string status = 4;
  string reason = 5;
  string description = 6;
  string source_event_id = 7;
  string source_type = 8;
  int64 source_id = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
  int64 settled_at = 12;
}

message GetBalanceRequest {
  int64 user_id = 1;
}

message BalanceResponse {
  Balance balance = 1;
}

message ListLedgerRequest {
  int64 user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListLedgerResponse {
  repeated LedgerEntry items = 1;
  int64 total = 2;
  Balance balance = 3;
}

message ListLeaderboardRequest {
  int32 limit = 1;
}

message ListLeaderboardResponse {
  repeated LeaderboardEntry items = 1;
}

message GetCheckInStatusRequest {
  int64 user_id = 1;
}

message CheckInStatusResponse {
  DailyCheckIn check_in = 1;
  bool checked_in = 2;
  int64 reward_credits = 3;
}

message CheckInRequest {
  int64 user_id = 1;
}

message CheckInResponse {
  DailyCheckIn check_in = 1;
  Balance balance = 2;
  LedgerEntry ledger = 3;
  bool duplicate = 4;
  int64 reward_credits = 5;
}

message TaskClaimStatus {
  int64 task_id = 1;
  string task_key = 2;
  string cycle = 3;
  bool completed = 4;
  bool claimed = 5;
}

message GetTaskClaimStatusRequest {
  int64 user_id = 1;
  int64 task_id = 2;
  string task_key = 3;
}

message TaskClaimStatusResponse {
  TaskClaimStatus status = 1;
}

message TaskClaimStatusInput {
  int64 task_id = 1;
  string task_key = 2;
}

message ListTaskClaimStatusesRequest {
  int64 user_id = 1;
  repeated TaskClaimStatusInput tasks = 2;
}

message ListTaskClaimStatusesResponse {
  repeated TaskClaimStatus items = 1;
}

message ClaimTaskRequest {
  int64 user_id = 1;
  int64 task_id = 2;
  string task_key = 3;
  int64 reward_credits = 4;
  string task_title = 5;
}

message ClaimTaskResponse {
  TaskClaimStatus status = 1;
  Balance balance = 2;
  LedgerEntry ledger = 3;
  bool duplicate = 4;
}

message DebitCreditsRequest {
  int64 user_id = 1;
  int64 amount = 2;
  string reason = 3;
  string description = 4;
  string source_event_id = 5;
  string source_type = 6;
  int64 source_id = 7;
}

message DebitCreditsResponse {
  Balance balance = 1;
  LedgerEntry ledger = 2;
  bool duplicate = 3;
}

message AdjustCreditsRequest {
  int64 user_id = 1;
  int64 delta = 2;
  string reason = 3;
  string description = 4;
  string source_event_id = 5;
  string source_type = 6;
  int64 source_id = 7;
}

message AdjustCreditsResponse {
  Balance balance = 1;
  LedgerEntry ledger = 2;
  bool duplicate = 3;
}

message TransferCreditsRequest {
  int64 payer_user_id = 1;
  int64 payee_user_id = 2;
  int64 amount = 3;
  string debit_reason = 4;
  string debit_description = 5;
  string credit_reason = 6;
  string credit_description = 7;
  string source_event_id = 8;
  string source_type = 9;
  int64 source_id = 10;
}

message TransferCreditsResponse {}

message ReserveCreditsRequest {
  int64 user_id = 1;
  int64 amount = 2;
  string reason = 3;
  string description = 4;
  string source_event_id = 5;
  string source_type = 6;
  int64 source_id = 7;
}

message ReserveCreditsResponse {
  Balance balance = 1;
  CreditReservation reservation = 2;
  bool duplicate = 3;
}

message ReleaseCreditsRequest {
  int64 user_id = 1;
  int64 amount = 2;
  string reservation_reason = 3;
  string release_reason = 4;
  string description = 5;
  string source_event_id = 6;
  string source_type = 7;
  int64 source_id = 8;
}

message ReleaseCreditsResponse {
  Balance balance = 1;
  CreditReservation reservation = 2;
  bool duplicate = 3;
}

message ReverseQAAcceptanceRequest {
  int64 question_author_id = 1;
  int64 topic_id = 2;
  int64 accepted_comment_id = 3;
  int64 accepted_comment_author_id = 4;
  int64 reward_credits = 5;
  int64 acceptance_cycle = 6;
  string title = 7;
}

message ReverseQAAcceptanceResponse {
  bool duplicate = 1;
}

message EraseUserDataRequest {
  int64 user_id = 1;
  int64 deletion_job_id = 2;
  int32 policy_version = 3;
}

message EraseUserDataResponse {
  bool completed = 1;
  int64 anonymized_ledger_entries = 2;
  int64 anonymized_reservations = 3;
  int64 deleted_check_ins = 4;
}
