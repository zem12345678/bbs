service:
  name: bbs-credit-service
  grpcPort: 9107

app:
  name: bbs-credit-service

nacos:
  addr: "127.0.0.1"
  port: 8848
  namespaceId: bbs-local
  dataId: "bbs-credit-service.yaml"
  groupId: "BBS_LOCAL"

log:
  filename: logs/credit-service.log
  maxSize: 100
  maxBackups: 7
  maxAge: 30
  level: info
  stdout: true

postgres:
  # Override in production with BBS_CREDIT_POSTGRES_DSN.
  dsn: postgres://bbs_credit_app:local_credit_pass@127.0.0.1:5432/bbs?sslmode=disable&search_path=bbs_credit
  debug: false
  max_open_conns: 1

redis:
  # Reuses the shared local Redis instance; no project-specific container is started.
  url: 127.0.0.1:6379
  addr: 127.0.0.1:6379
  dbNum: 0
  db: 0
  password: ""
  maxIdle: 10
  maxActive: 100
  idleTimeout: 10
  timeout: 5
  network: tcp

kafka:
  # Override in production with comma-separated BBS_CREDIT_KAFKA_BROKERS.
  brokers:
    - 127.0.0.1:9092
  userTopic: user.events
  articleTopic: article.events
  commentTopic: comment.events
  reactionTopic: reaction.events
  userGroupId: bbs-credit-user-consumer
  articleGroupId: bbs-credit-article-consumer
  commentGroupId: bbs-credit-comment-consumer
  reactionGroupId: bbs-credit-reaction-consumer

grpc:
  server:
    port: 9107
    etcdAddr:
      - "127.0.0.1:2379"
    serviceName: "bbs-credit-service"
    timeout: 10s
    # Override in production with BBS_CREDIT_GRPC_SERVER_INTERNAL_AUTH_TOKEN.
    internalAuthToken: ""
  client:
    timeout: 10s
    tag: "credit"
    etcdAddr:
      - "127.0.0.1:2379"
    serverName: "bbs-credit-service"
    secure: false

trace:
  grpcEndpoint: 127.0.0.1:4317
  serviceName: bbs-credit-service
  version: local
  env: local
