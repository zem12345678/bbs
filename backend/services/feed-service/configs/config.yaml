service:
  name: bbs-feed-service
  grpcPort: 9113

app:
  name: bbs-feed-service

nacos:
  addr: "127.0.0.1"
  port: 8848
  namespaceId: bbs-local
  dataId: "bbs-feed-service.yaml"
  groupId: "BBS_LOCAL"

log:
  filename: logs/feed-service.log
  maxSize: 100
  maxBackups: 7
  maxAge: 30
  level: info
  stdout: true

redis:
  # Override in production with BBS_FEED_REDIS_ADDR and BBS_FEED_REDIS_PASSWORD.
  url: 127.0.0.1:6379
  addr: 127.0.0.1:6379
  dbNum: 0
  db: 0
  password: ""
  maxIdle: 10
  maxActive: 100
  idleTimeout: 10
  timeout: 5
  network: "tcp"

kafka:
  # Override in production with comma-separated BBS_FEED_KAFKA_BROKERS.
  brokers:
    - 127.0.0.1:9092
  articleTopic: article.events
  commentTopic: comment.events
  reactionTopic: reaction.events
  articleGroupId: bbs-feed-article-projector
  commentGroupId: bbs-feed-comment-projector
  reactionGroupId: bbs-feed-reaction-projector

grpc:
  server:
    port: 9113
    etcdAddr:
      - "127.0.0.1:2379"
    serviceName: "bbs-feed-service"
    timeout: 10s
  client:
    timeout: 10s
    tag: "feed"
    etcdAddr:
      - "127.0.0.1:2379"
    serverName: "bbs-feed-service"
    secure: false

trace:
  grpcEndpoint: 127.0.0.1:4317
  serviceName: bbs-feed-service
  version: local
  env: local
