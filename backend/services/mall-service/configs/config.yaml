service:
  name: bbs-mall-service
  grpcPort: 9115

app:
  name: bbs-mall-service

nacos:
  addr: "127.0.0.1"
  port: 8848
  namespaceId: bbs-local
  dataId: "bbs-mall-service.yaml"
  groupId: "BBS_LOCAL"

log:
  filename: logs/mall-service.log
  maxSize: 100
  maxBackups: 7
  maxAge: 30
  level: info
  stdout: true

postgres:
  dsn: postgres://bbs_mall_app:local_mall_pass@127.0.0.1:5432/bbs?sslmode=disable&search_path=bbs_mall
  debug: false
  max_open_conns: 2

kafka:
  brokers:
    - 127.0.0.1:9092
  topic: mall.events
  mallTopic: mall.events
  producerOptions:
    topic: mall.events

outbox:
  owner: bbs-mall-service
  batchSize: 100
  maxAttempts: 10
  interval: 1s
  retryDelay: 3s

order:
  expireAfter: 30m
  paymentRecoveryAfter: 30m
  expireScanInterval: 1m
  expireScanBatchSize: 100

upstreams:
  credit: bbs-credit-service
  # Must match credit-service grpc.server.internalAuthToken.
  creditInternalAuthToken: ""

grpc:
  server:
    port: 9115
    etcdAddr:
      - "127.0.0.1:2379"
    serviceName: "bbs-mall-service"
    timeout: 10s
    # Override in production with BBS_MALL_GRPC_SERVER_INTERNAL_AUTH_TOKEN.
    internalAuthToken: ""
  client:
    timeout: 10s
    tag: "mall"
    etcdAddr:
      - "127.0.0.1:2379"
    serverName: "bbs-mall-service"
    secure: false

trace:
  grpcEndpoint: 127.0.0.1:4317
  serviceName: bbs-mall-service
  version: local
  env: local
