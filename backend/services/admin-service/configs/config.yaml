service:
  name: bbs-admin-service
  grpcPort: 9114

app:
  name: bbs-admin-service

nacos:
  addr: "127.0.0.1"
  port: 8848
  namespaceId: bbs-local
  dataId: "bbs-admin-service.yaml"
  groupId: "BBS_LOCAL"

log:
  filename: logs/admin-service.log
  maxSize: 100
  maxBackups: 7
  maxAge: 30
  level: info
  stdout: true

postgres:
  dsn: postgres://bbs_admin_app:local_admin_pass@127.0.0.1:5432/bbs?sslmode=disable&search_path=bbs_admin
  debug: false
  max_open_conns: 1

redis:
  url: "127.0.0.1:6379"
  dbNum: 0
  password: ""
  maxIdle: 10
  maxActive: 100
  idleTimeout: 10
  timeout: 5
  network: "tcp"

grpc:
  server:
    port: 9114
    etcdAddr:
      - "127.0.0.1:2379"
    serviceName: "bbs-admin-service"
    timeout: 10s
    # Override in production with BBS_ADMIN_GRPC_SERVER_INTERNAL_AUTH_TOKEN.
    internalAuthToken: ""
    tls:
      # Production requires mTLS files mounted from a Secret.
      enabled: false
      certFile: ""
      keyFile: ""
      clientCAFile: ""
  client:
    timeout: 10s
    tag: "admin"
    etcdAddr:
      - "127.0.0.1:2379"
    serverName: "bbs-admin-service"
    secure: false

trace:
  grpcEndpoint: 127.0.0.1:4317
  serviceName: bbs-admin-service
  version: local
  env: local

rbac:
  bootstrapAdminPrefixes:
    - admin

auth:
  # Override secrets in production with BBS_ADMIN_AUTH_JWT_SECRET and BBS_ADMIN_AUTH_SECRET_ENCRYPTION_KEY.
  jwtSecret: ""
  jwtTtl: 168h
  refreshTtl: 720h
  defaultAdminPassword: ""
  secretEncryptionKey: ""

upstreams:
  user: bbs-user-service
  # Must match user-service grpc.server.internalAuthToken.
  userInternalAuthToken: ""
  reaction: bbs-reaction-service
  # Must match reaction-service grpc.server.internalAuthToken.
  reactionInternalAuthToken: ""
  content: bbs-content-service
  # Must match content-service grpc.server.internalAuthToken.
  contentInternalAuthToken: ""
  comment: bbs-comment-service
  # Must match comment-service grpc.server.internalAuthToken.
  commentInternalAuthToken: ""
  notification: bbs-notification-service
  # Must match notification-service grpc.server.internalAuthToken.
  notificationInternalAuthToken: ""
  search: bbs-search-service
  # Must match search-service grpc.server.internalAuthToken.
  searchInternalAuthToken: ""
