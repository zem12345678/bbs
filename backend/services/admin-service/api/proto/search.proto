syntax = "proto3";

package bbs.search.v1;

option go_package = "admin/api/proto/searchpb;searchpb";

service SearchService {
  rpc EnsureArticleIndex(EnsureArticleIndexRequest) returns (SimpleResponse);
  rpc EnsureTopicIndex(EnsureTopicIndexRequest) returns (SimpleResponse);
  rpc IndexArticle(IndexArticleRequest) returns (SimpleResponse);
  rpc IndexTopic(IndexTopicRequest) returns (SimpleResponse);
  rpc ReindexArticle(IndexArticleRequest) returns (SimpleResponse);
  rpc ReindexTopic(IndexTopicRequest) returns (SimpleResponse);
  rpc DeleteArticle(DeleteArticleRequest) returns (SimpleResponse);
  rpc DeleteTopic(DeleteTopicRequest) returns (SimpleResponse);
  rpc SearchArticles(SearchArticlesRequest) returns (SearchArticlesResponse);
  rpc SearchTopics(SearchTopicsRequest) returns (SearchTopicsResponse);
}

message SimpleResponse {
  bool success = 1;
  string message = 2;
}

message EnsureArticleIndexRequest {}
message EnsureTopicIndexRequest {}

message ArticleDocument {
  int64 id = 1;
  string title = 2;
  string summary = 3;
  string content_excerpt = 4;
  repeated string tag_ids = 5;
  repeated string tag_names = 6;
  int64 author_id = 7;
  string author_nickname = 8;
  int32 status = 9;
  int64 view_count = 10;
  int64 comment_count = 11;
  int64 like_count = 12;
  int64 favorite_count = 13;
  int64 created_at = 14;
  int64 updated_at = 15;
}

message IndexArticleRequest {
  ArticleDocument article = 1;
}

message TopicDocument {
  int64 id = 1;
  string slug = 2;
  string type = 3;
  string title = 4;
  string content_excerpt = 5;
  repeated string tag_names = 6;
  int64 author_id = 7;
  int32 status = 8;
  int64 comment_count = 9;
  int64 like_count = 10;
  int64 favorite_count = 11;
  int64 created_at = 12;
  int64 updated_at = 13;
  int64 view_count = 14;
  int64 category_id = 15;
}

message IndexTopicRequest {
  TopicDocument topic = 1;
}

message DeleteArticleRequest {
  int64 id = 1;
}

message DeleteTopicRequest {
  int64 id = 1;
}

message SearchArticlesRequest {
  string keyword = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message SearchTopicsRequest {
  string keyword = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message SearchHighlight {
  repeated string title = 1;
  repeated string summary = 2;
  repeated string content_excerpt = 3;
  repeated string tag_names = 4;
}

message ArticleHit {
  ArticleDocument article = 1;
  double score = 2;
  SearchHighlight highlight = 3;
}

message SearchArticlesResponse {
  repeated ArticleHit items = 1;
  int64 total = 2;
}

message TopicHit {
  TopicDocument topic = 1;
  double score = 2;
  SearchHighlight highlight = 3;
}

message SearchTopicsResponse {
  repeated TopicHit items = 1;
  int64 total = 2;
}
