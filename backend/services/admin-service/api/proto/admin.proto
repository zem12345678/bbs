syntax = "proto3";

package bbs.admin.v1;

option go_package = "admin/api/proto/adminpb;adminpb";

service AdminService {
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc Refresh(RefreshTokenRequest) returns (AuthResponse);
  rpc Logout(LogoutRequest) returns (SimpleResponse);
  rpc GetProfile(ProfileRequest) returns (ProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (ProfileResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (ProfileResponse);
  rpc ListReports(ListReportsRequest) returns (ReportListResponse);
  rpc AuditReport(AuditReportRequest) returns (ReportResponse);
  rpc ListUsers(ListUsersRequest) returns (UserListResponse);
  rpc MuteUser(UserStatusRequest) returns (UserResponse);
  rpc UnmuteUser(UserStatusRequest) returns (UserResponse);
  rpc ListArticles(ListArticlesRequest) returns (ArticleListResponse);
  rpc PublishArticle(ArticleStatusRequest) returns (ArticleResponse);
  rpc HideArticle(ArticleStatusRequest) returns (ArticleResponse);
  rpc ArchiveArticle(ArticleStatusRequest) returns (ArticleResponse);
  rpc ListTopics(ListTopicsRequest) returns (TopicListResponse);
  rpc PublishTopic(TopicStatusRequest) returns (TopicResponse);
  rpc HideTopic(TopicStatusRequest) returns (TopicResponse);
  rpc ArchiveTopic(TopicStatusRequest) returns (TopicResponse);
  rpc ListChannels(ListChannelsRequest) returns (ChannelListResponse);
  rpc SetChannelFeatured(ChannelFeaturedRequest) returns (ChannelResponse);
  rpc SetChannelArchived(ChannelArchivedRequest) returns (ChannelResponse);
  rpc ListCategories(ListCategoriesRequest) returns (CategoryListResponse);
  rpc CreateCategory(UpsertCategoryRequest) returns (CategoryResponse);
  rpc UpdateCategory(UpsertCategoryRequest) returns (CategoryResponse);
  rpc DeleteCategory(CategoryIDRequest) returns (SimpleResponse);
  rpc ListComments(ListCommentsRequest) returns (CommentListResponse);
  rpc HideComment(CommentStatusRequest) returns (SimpleResponse);
  rpc RestoreComment(CommentStatusRequest) returns (SimpleResponse);
  rpc ListAdminUsers(ListAdminUsersRequest) returns (AdminUserListResponse);
  rpc CreateAdminUser(CreateAdminUserRequest) returns (AdminUserResponse);
  rpc ListRoles(ListRolesRequest) returns (RoleListResponse);
  rpc AssignRoles(AssignRolesRequest) returns (AdminUserResponse);
  rpc ListSystemUsers(ListSystemUsersRequest) returns (SystemUserListResponse);
  rpc CreateSystemUser(UpsertSystemUserRequest) returns (SystemUserResponse);
  rpc UpdateSystemUser(UpsertSystemUserRequest) returns (SystemUserResponse);
  rpc DeleteSystemUser(SystemUserIDRequest) returns (SimpleResponse);
  rpc ResetSystemUserPassword(ResetSystemUserPasswordRequest) returns (SystemUserResponse);
  rpc AssignSystemUserRoles(AssignSystemUserRolesRequest) returns (SystemUserResponse);
  rpc ListSystemRoles(ListSystemRolesRequest) returns (SystemRoleListResponse);
  rpc GetSystemRole(SystemRoleIDRequest) returns (SystemRoleResponse);
  rpc CreateSystemRole(UpsertSystemRoleRequest) returns (SystemRoleResponse);
  rpc UpdateSystemRole(UpsertSystemRoleRequest) returns (SystemRoleResponse);
  rpc DeleteSystemRole(SystemRoleIDRequest) returns (SimpleResponse);
  rpc AssignSystemRoleMenus(AssignSystemRoleMenusRequest) returns (SystemRoleResponse);
  rpc ListSystemMenus(ListSystemMenusRequest) returns (SystemMenuListResponse);
  rpc ListCurrentSystemMenus(CurrentSystemMenusRequest) returns (SystemMenuListResponse);
  rpc CreateSystemMenu(UpsertSystemMenuRequest) returns (SystemMenuResponse);
  rpc UpdateSystemMenu(UpsertSystemMenuRequest) returns (SystemMenuResponse);
  rpc DeleteSystemMenu(SystemMenuIDRequest) returns (SimpleResponse);
  rpc ListSystemDepts(ListSystemDeptsRequest) returns (SystemDeptListResponse);
  rpc CreateSystemDept(UpsertSystemDeptRequest) returns (SystemDeptResponse);
  rpc UpdateSystemDept(UpsertSystemDeptRequest) returns (SystemDeptResponse);
  rpc DeleteSystemDept(SystemDeptIDRequest) returns (SimpleResponse);
  rpc ListBadges(ListBadgesRequest) returns (BadgeListResponse);
  rpc CreateBadge(UpsertBadgeRequest) returns (BadgeResponse);
  rpc UpdateBadge(UpsertBadgeRequest) returns (BadgeResponse);
  rpc DeleteBadge(BadgeIDRequest) returns (SimpleResponse);
  rpc ListLevels(ListLevelsRequest) returns (LevelListResponse);
  rpc CreateLevel(UpsertLevelRequest) returns (LevelResponse);
  rpc UpdateLevel(UpsertLevelRequest) returns (LevelResponse);
  rpc DeleteLevel(LevelIDRequest) returns (SimpleResponse);
  rpc ListForbiddenWords(ListForbiddenWordsRequest) returns (ForbiddenWordListResponse);
  rpc CreateForbiddenWord(UpsertForbiddenWordRequest) returns (ForbiddenWordResponse);
  rpc UpdateForbiddenWord(UpsertForbiddenWordRequest) returns (ForbiddenWordResponse);
  rpc DeleteForbiddenWord(ForbiddenWordIDRequest) returns (SimpleResponse);
  rpc ListSettings(ListSettingsRequest) returns (SettingListResponse);
  rpc ListAuthSettings(ListAuthSettingsRequest) returns (SettingListResponse);
  rpc ListPublicSettings(ListPublicSettingsRequest) returns (SettingListResponse);
  rpc UpdateSetting(UpsertSettingRequest) returns (SettingResponse);
  rpc ListEmailLogs(ListEmailLogsRequest) returns (EmailLogListResponse);
  rpc ListLoginLogs(ListLoginLogsRequest) returns (LoginLogListResponse);
  rpc ListOperationLogs(ListOperationLogsRequest) returns (OperationLogListResponse);
  rpc RecordOperationLog(RecordOperationLogRequest) returns (SimpleResponse);
  rpc ListLinks(ListLinksRequest) returns (LinkListResponse);
  rpc CreateLink(UpsertLinkRequest) returns (LinkResponse);
  rpc UpdateLink(UpsertLinkRequest) returns (LinkResponse);
  rpc DeleteLink(LinkIDRequest) returns (SimpleResponse);
  rpc ListTasks(ListTasksRequest) returns (TaskListResponse);
  rpc CreateTask(UpsertTaskRequest) returns (TaskResponse);
  rpc UpdateTask(UpsertTaskRequest) returns (TaskResponse);
  rpc DeleteTask(TaskIDRequest) returns (SimpleResponse);
  rpc SendSystemNotification(SendSystemNotificationRequest) returns (SendSystemNotificationResponse);
  rpc StartSearchRebuild(SearchRebuildRequest) returns (SearchRebuildStatusResponse);
  rpc GetSearchRebuildStatus(SearchRebuildStatusRequest) returns (SearchRebuildStatusResponse);
}

message Actor {
  int64 id = 1;
  string username = 2;
}

message EntityRef {
  string entity_type = 1;
  int64 entity_id = 2;
}

message ReportInfo {
  int64 id = 1;
  EntityRef entity = 2;
  int64 reporter_id = 3;
  string reason = 4;
  string description = 5;
  int32 status = 6;
  int64 handled_by = 7;
  int64 handled_at = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
  string audit_note = 11;
  string target_action = 12;
}

message UserInfo {
  int64 id = 1;
  string username = 2;
  string email = 3;
  string nickname = 4;
  string avatar_url = 5;
  string bio = 6;
  int32 status = 7;
  int64 follower_count = 8;
  int64 following_count = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
  int64 last_login_at = 12;
  string background_url = 13;
}

message ArticleInfo {
  int64 id = 1;
  string slug = 2;
  string title = 3;
  string summary = 4;
  string body = 5;
  string cover_url = 6;
  repeated string tags = 7;
  int64 author_id = 8;
  int32 status = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
  int64 published_at = 12;
}

message TopicInfo {
  int64 id = 1;
  string slug = 2;
  string type = 3;
  string title = 4;
  string body = 5;
  repeated string tags = 6;
  int64 author_id = 7;
  int32 status = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
  int64 published_at = 11;
  int64 category_id = 12;
}

message CommentInfo {
  int64 id = 1;
  string entity_type = 2;
  int64 entity_id = 3;
  int64 root_id = 4;
  int64 parent_id = 5;
  int64 author_id = 6;
  string content = 7;
  int32 status = 8;
  int64 reply_count = 9;
  int64 like_count = 10;
  int64 created_at = 11;
  int64 updated_at = 12;
}

message AdminUserInfo {
  int64 id = 1;
  string username = 2;
  string email = 3;
  string nickname = 4;
  string avatar_url = 5;
  int32 status = 6;
  int32 locked_flag = 7;
