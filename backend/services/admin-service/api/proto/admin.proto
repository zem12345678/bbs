message ListLinksRequest {
  Actor actor = 1;
  int32 status = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message LinkListResponse {
  repeated LinkInfo items = 1;
  int64 total = 2;
}

message UpsertLinkRequest {
  Actor actor = 1;
  int64 id = 2;
  string key = 3;
  string title = 4;
  string url = 5;
  string description = 6;
  int32 status = 7;
  int32 sort = 8;
}

message LinkIDRequest {
  Actor actor = 1;
  int64 id = 2;
}

message LinkResponse {
  bool success = 1;
  string message = 2;
  LinkInfo link = 3;
}

message TaskInfo {
  int64 id = 1;
  string key = 2;
  string title = 3;
  string description = 4;
  int64 reward_points = 5;
  int32 status = 6;
  int32 sort = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
}

message ListTasksRequest {
  Actor actor = 1;
  int32 status = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message TaskListResponse {
  repeated TaskInfo items = 1;
  int64 total = 2;
}

message UpsertTaskRequest {
  Actor actor = 1;
  int64 id = 2;
  string key = 3;
  string title = 4;
  string description = 5;
  int64 reward_points = 6;
  int32 status = 7;
  int32 sort = 8;
}

message TaskIDRequest {
  Actor actor = 1;
  int64 id = 2;
}

message TaskResponse {
  bool success = 1;
  string message = 2;
  TaskInfo task = 3;
}

message SendSystemNotificationRequest {
  Actor actor = 1;
  repeated int64 recipient_ids = 2;
  string title = 3;
  string content = 4;
  string idempotency_key = 5;
}

message SendSystemNotificationResponse {
	bool success = 1;
	string message = 2;
	int32 delivered_count = 3;
}

message SearchRebuildRequest {
	Actor actor = 1;
}

message SearchRebuildStatusRequest {
	Actor actor = 1;
}

message SearchRebuildStatus {
	string job_id = 1;
	string state = 2;
	int64 requested_by = 3;
	int64 article_total = 4;
	int64 article_indexed = 5;
	int64 topic_total = 6;
	int64 topic_indexed = 7;
	int64 started_at = 8;
	int64 completed_at = 9;
	int64 updated_at = 10;
	string error = 11;
	int64 user_total = 12;
	int64 user_indexed = 13;
}

message SearchRebuildStatusResponse {
	bool success = 1;
	string message = 2;
	SearchRebuildStatus status = 3;
}

message ChannelInfo {
  int64 id = 1;
  int64 owner_id = 2;
  int64 category_id = 3;
  string name = 4;
  string description = 5;
  string color = 6;
  bool is_archived = 7;
  int64 followers_count = 8;
  int64 topics_count = 9;
  int64 last_posted_at = 10;
  int64 created_at = 11;
  int64 updated_at = 12;
  bool is_featured = 13;
}

message ListChannelsRequest {
  Actor actor = 1;
  string query = 2;
  int64 category_id = 3;
  int32 archived_status = 4;
  int32 limit = 5;
  int32 offset = 6;
}

message ChannelListResponse {
  repeated ChannelInfo items = 1;
  int64 total = 2;
}

message ChannelFeaturedRequest {
  Actor actor = 1;
  int64 id = 2;
  bool featured = 3;
}

message ChannelArchivedRequest {
  Actor actor = 1;
  int64 id = 2;
  bool archived = 3;
}

message ChannelResponse {
  bool success = 1;
  string message = 2;
  ChannelInfo channel = 3;
}
