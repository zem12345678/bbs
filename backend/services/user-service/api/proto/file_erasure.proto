syntax = "proto3";

package bbs.file.v1;

option go_package = "user-service/api/proto/filepb;filepb";

service FileService {
  rpc EraseUserData(EraseUserDataRequest) returns (EraseUserDataResponse);
}

message EraseUserDataRequest {
  int64 user_id = 1;
  int64 deletion_job_id = 2;
  int32 policy_version = 3;
}

message EraseUserDataResponse {
  bool completed = 1;
  int64 archived_attachments = 2;
  int64 deleted_downloads = 3;
  int64 deleted_objects = 4;
}
