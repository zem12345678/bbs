syntax = "proto3";

package bbs.user.v1;

option go_package = "user-service/api/proto/userpb;userpb";

service UserService {
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc OAuthLogin(OAuthLoginRequest) returns (AuthResponse);
  rpc WebmasterLogin(WebmasterLoginRequest) returns (AuthResponse);
  rpc ListUsers(ListUsersRequest) returns (UserListResponse);
  rpc GetUser(UserIDRequest) returns (UserResponse);
  rpc GetUserByUsername(UsernameRequest) returns (UserResponse);
  // GetCredentialVersion is for trusted internal callers that validate JWT
  // credential-version claims. It is not part of the public profile surface.
  rpc GetCredentialVersion(UserIDRequest) returns (CredentialVersionResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UserResponse);
  rpc UpdateUserMemo(UpdateUserMemoRequest) returns (SimpleResponse);
  rpc GetUserMemo(GetUserMemoRequest) returns (UserMemoResponse);
  rpc UpdateStatus(UpdateStatusRequest) returns (UserResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (SimpleResponse);
  rpc RequestPasswordReset(PasswordResetRequest) returns (PasswordResetResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (SimpleResponse);
  rpc RequestEmailVerification(EmailVerificationRequest) returns (EmailVerificationResponse);
  rpc VerifyEmail(VerifyEmailRequest) returns (UserResponse);
  rpc GetMFAStatus(UserIDRequest) returns (MFAStatusResponse);
  rpc BeginTOTPEnrollment(BeginTOTPEnrollmentRequest) returns (TOTPEnrollmentResponse);
  rpc ConfirmTOTPEnrollment(ConfirmTOTPEnrollmentRequest) returns (MFARecoveryCodesResponse);
  rpc RegenerateMFARecoveryCodes(MFAReauthenticateRequest) returns (MFARecoveryCodesResponse);
  rpc DisableTOTP(MFAReauthenticateRequest) returns (SimpleResponse);
  rpc CompleteMFALogin(CompleteMFALoginRequest) returns (AuthResponse);
  rpc ListPasskeys(UserIDRequest) returns (PasskeyListResponse);
  rpc BeginPasskeyRegistration(BeginPasskeyRegistrationRequest) returns (PasskeyOptionsResponse);
  rpc FinishPasskeyRegistration(FinishPasskeyRegistrationRequest) returns (PasskeyInfoResponse);
  rpc UpdatePasskey(UpdatePasskeyRequest) returns (PasskeyInfoResponse);
  rpc DeletePasskey(DeletePasskeyRequest) returns (SimpleResponse);
  rpc SetPasskeyPasswordless(SetPasskeyPasswordlessRequest) returns (SimpleResponse);
  rpc BeginPasskeyMFALogin(BeginPasskeyMFALoginRequest) returns (PasskeyOptionsResponse);
  rpc CompletePasskeyMFALogin(CompletePasskeyLoginRequest) returns (AuthResponse);
  rpc BeginPasswordlessPasskeyLogin(PasswordlessPasskeyOptionsRequest) returns (PasskeyOptionsResponse);
  rpc CompletePasswordlessPasskeyLogin(CompletePasskeyLoginRequest) returns (AuthResponse);
  rpc GetAccountLifecycle(UserIDRequest) returns (AccountLifecycleResponse);
  rpc RequestAccountDeletion(RequestAccountDeletionRequest) returns (AccountLifecycleResponse);
  rpc Follow(FollowRequest) returns (FollowResponse);
  rpc GetFollowing(GetFollowingRequest) returns (FollowingResponse);
  rpc UpdateFollowing(UpdateFollowingRequest) returns (FollowingResponse);
  rpc UpdateAllFollowings(UpdateAllFollowingsRequest) returns (SimpleResponse);
  rpc ListFollowingEdges(ListFollowingEdgesRequest) returns (FollowingListResponse);
  rpc ListFollowerEdges(ListFollowingEdgesRequest) returns (FollowingListResponse);
  rpc ListNoteNotificationSubscribers(ListNoteNotificationSubscribersRequest) returns (NoteNotificationSubscribersResponse);
  rpc ListReceivedFollowRequests(ListFollowRequestsRequest) returns (FollowRequestListResponse);
  rpc ListSentFollowRequests(ListFollowRequestsRequest) returns (FollowRequestListResponse);
  rpc AcceptFollowRequest(FollowRequestActionRequest) returns (SimpleResponse);
  rpc RejectFollowRequest(FollowRequestActionRequest) returns (SimpleResponse);
  rpc CancelFollowRequest(FollowRequestActionRequest) returns (SimpleResponse);
  rpc SetFollowApprovalRequired(SetFollowApprovalRequest) returns (SimpleResponse);
  rpc Unfollow(FollowRequest) returns (SimpleResponse);
  rpc IsFollowing(FollowRequest) returns (IsFollowingResponse);
  rpc ListFollowers(ListFollowsRequest) returns (UserListResponse);
  rpc ListFollowing(ListFollowsRequest) returns (UserListResponse);
  rpc Block(UserRelationRequest) returns (SimpleResponse);
  rpc Unblock(UserRelationRequest) returns (SimpleResponse);
  rpc Mute(UserRelationRequest) returns (SimpleResponse);
  rpc Unmute(UserRelationRequest) returns (SimpleResponse);
  rpc GetSafetyRelation(UserRelationRequest) returns (SafetyRelationResponse);
  rpc ListBlockedUsers(ListUserRelationsRequest) returns (UserListResponse);
  rpc ListMutedUsers(ListUserRelationsRequest) returns (UserListResponse);
  rpc CreateInviteCodes(CreateInviteCodesRequest) returns (InviteCodeListResponse);
  rpc ListInviteCodes(ListInviteCodesRequest) returns (InviteCodeListResponse);
  rpc RevokeInviteCode(RevokeInviteCodeRequest) returns (SimpleResponse);
  rpc CreateUserList(CreateUserListRequest) returns (UserListInfoResponse);
  rpc UpdateUserList(UpdateUserListRequest) returns (UserListInfoResponse);
  rpc DeleteUserList(DeleteUserListRequest) returns (SimpleResponse);
  rpc GetUserList(GetUserListRequest) returns (UserListInfoResponse);
  rpc ListUserLists(ListUserListsRequest) returns (UserListsResponse);
  rpc ListFavoriteUserLists(ListFavoriteUserListsRequest) returns (UserListsResponse);
  rpc AddUserListMember(UserListMemberRequest) returns (SimpleResponse);
  rpc RemoveUserListMember(UserListMemberRequest) returns (SimpleResponse);
  rpc ListUserListMembers(ListUserListMembersRequest) returns (UserListResponse);
  rpc CopyUserList(CopyUserListRequest) returns (UserListInfoResponse);
  rpc FavoriteUserList(UserListFavoriteRequest) returns (UserListInfoResponse);
  rpc UnfavoriteUserList(UserListFavoriteRequest) returns (UserListInfoResponse);
  rpc CreateAntenna(CreateAntennaRequest) returns (AntennaInfoResponse);
  rpc UpdateAntenna(UpdateAntennaRequest) returns (AntennaInfoResponse);
  rpc DeleteAntenna(DeleteAntennaRequest) returns (SimpleResponse);
  rpc GetAntenna(GetAntennaRequest) returns (AntennaInfoResponse);
  rpc ListAntennas(ListAntennasRequest) returns (AntennaListResponse);
  rpc SetRegistryItem(SetRegistryItemRequest) returns (RegistryItemResponse);
  rpc GetRegistryItem(GetRegistryItemRequest) returns (RegistryItemResponse);
  rpc ListRegistryItems(ListRegistryItemsRequest) returns (RegistryItemListResponse);
  rpc RemoveRegistryItem(GetRegistryItemRequest) returns (SimpleResponse);
  rpc ListRegistryScopeDomains(UserIDRequest) returns (RegistryScopeDomainListResponse);
  rpc ListSessions(ListSessionsRequest) returns (SessionListResponse);
  rpc GetSession(GetSessionRequest) returns (SessionResponse);
  rpc RevokeSession(RevokeSessionRequest) returns (SessionResponse);
  rpc ListLoginEvents(ListLoginEventsRequest) returns (LoginEventListResponse);
  rpc CreateAPIToken(CreateAPITokenRequest) returns (CreateAPITokenResponse);
  rpc ListAPITokens(ListAPITokensRequest) returns (APITokenListResponse);
  rpc RevokeAPIToken(RevokeAPITokenRequest) returns (APITokenResponse);
  rpc GetUserChart(UserChartRequest) returns (UserChartResponse);
  rpc GetUserFollowingChart(UserFollowingChartRequest) returns (UserFollowingChartResponse);
  rpc GetActiveUsersChart(ActiveUsersChartRequest) returns (ActiveUsersChartResponse);
}

message UserInfo {
  int64 id = 1;
  string username = 2;
  string email = 3;
  string nickname = 4;
  string avatar_url = 5;
  string bio = 6;
  int32 status = 7;
  int64 follower_count = 8;
  int64 following_count = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
  int64 last_login_at = 12;
  bool email_verified = 13;
  int64 email_verified_at = 14;
  string background_url = 15;
  string profile_theme = 16;
  string account_state = 17;
  bool follow_approval_required = 18;
  string birthday = 19;
  string following_visibility = 20;
  string followers_visibility = 21;
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string nickname = 4;
  string invite_code = 5;
  bool require_invite = 6;
  SessionClientInfo client = 7;
}

message LoginRequest {
  string account = 1;
  string password = 2;
  SessionClientInfo client = 3;
}

message BeginTOTPEnrollmentRequest {
  int64 user_id = 1;
  string password = 2;
  string current_code = 3;
}

message ConfirmTOTPEnrollmentRequest {
  int64 user_id = 1;
  string code = 2;
}

message MFAReauthenticateRequest {
  int64 user_id = 1;
  string password = 2;
  string code = 3;
}

message CompleteMFALoginRequest {
  string challenge = 1;
  string code = 2;
  SessionClientInfo client = 3;
}

message BeginPasskeyRegistrationRequest {
  int64 user_id = 1;
  string name = 2;
  string password = 3;
  string code = 4;
}

message FinishPasskeyRegistrationRequest {
  int64 user_id = 1;
  string challenge = 2;
  string credential_json = 3;
}

message UpdatePasskeyRequest {
  int64 user_id = 1;
  string credential_id = 2;
  string name = 3;
}

message DeletePasskeyRequest {
  int64 user_id = 1;
  string credential_id = 2;
  string password = 3;
  string code = 4;
}

message SetPasskeyPasswordlessRequest {
  int64 user_id = 1;
  bool enabled = 2;
  string password = 3;
  string code = 4;
}

message BeginPasskeyMFALoginRequest {
  string mfa_challenge = 1;
}

message PasswordlessPasskeyOptionsRequest {}

message CompletePasskeyLoginRequest {
  string challenge = 1;
  string credential_json = 2;
  SessionClientInfo client = 3;
}

message RequestAccountDeletionRequest {
  int64 user_id = 1;
  string password = 2;
  string code = 3;
}

message OAuthLoginRequest {
  string provider = 1;
  string provider_user_id = 2;
  string username = 3;
  string email = 4;
  string nickname = 5;
  string avatar_url = 6;
  bool existing_only = 7;
  SessionClientInfo client = 8;
}

message CreateInviteCodesRequest {
  int64 actor_id = 1;
  int32 count = 2;
  int64 expires_at = 3; // Unix seconds; 0 means no expiry.
}

message ListInviteCodesRequest {
  string status = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message RevokeInviteCodeRequest {
  int64 actor_id = 1;
  int64 id = 2;
}

message CreateUserListRequest {
  int64 owner_id = 1;
  string name = 2;
  bool is_public = 3;
}

message UpdateUserListRequest {
  int64 owner_id = 1;
  int64 list_id = 2;
  string name = 3;
  bool is_public = 4;
}

message DeleteUserListRequest {
  int64 owner_id = 1;
  int64 list_id = 2;
}

message GetUserListRequest {
  int64 viewer_id = 1; // 0 means anonymous.
  int64 list_id = 2;
}

message ListUserListsRequest {
  int64 viewer_id = 1; // 0 means anonymous.
  int64 owner_id = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListFavoriteUserListsRequest {
  int64 user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message UserListMemberRequest {
  int64 owner_id = 1;
  int64 list_id = 2;
  int64 user_id = 3;
}

message ListUserListMembersRequest {
  int64 viewer_id = 1; // 0 means anonymous.
  int64 list_id = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message CopyUserListRequest {
  int64 owner_id = 1;
  int64 source_list_id = 2;
  string name = 3;
}

message UserListFavoriteRequest {
  int64 user_id = 1;
  int64 list_id = 2;
}

message AntennaKeywordGroup {
  repeated string terms = 1;
}

message CreateAntennaRequest {
  int64 owner_id = 1;
  string name = 2;
  string source = 3;
  int64 user_list_id = 4;
  repeated AntennaKeywordGroup keywords = 5;
  repeated AntennaKeywordGroup exclude_keywords = 6;
  repeated string users = 7;
  bool case_sensitive = 8;
  bool local_only = 9;
  bool exclude_bots = 10;
  bool with_replies = 11;
  bool with_file = 12;
  bool exclude_notes_in_sensitive_channel = 13;
}

message UpdateAntennaRequest {
  int64 owner_id = 1;
  int64 antenna_id = 2;
  string name = 3;
  string source = 4;
  int64 user_list_id = 5;
  repeated AntennaKeywordGroup keywords = 6;
  repeated AntennaKeywordGroup exclude_keywords = 7;
  repeated string users = 8;
  bool case_sensitive = 9;
  bool local_only = 10;
  bool exclude_bots = 11;
  bool with_replies = 12;
  bool with_file = 13;
  bool exclude_notes_in_sensitive_channel = 14;
}

message DeleteAntennaRequest {
  int64 owner_id = 1;
  int64 antenna_id = 2;
}

message GetAntennaRequest {
  int64 owner_id = 1;
  int64 antenna_id = 2;
}

message ListAntennasRequest {
  int64 owner_id = 1;
}

message WebmasterLoginRequest {
  string username = 1;
  string password = 2;
  string email = 3;
  string nickname = 4;
  SessionClientInfo client = 5;
}

message UpdateProfileRequest {
  int64 id = 1;
  string nickname = 2;
  string avatar_url = 3;
  string bio = 4;
  string background_url = 5;
  string profile_theme = 6;
  optional string birthday = 7;
  optional string following_visibility = 8;
  optional string followers_visibility = 9;
}

message UpdateUserMemoRequest {
  int64 user_id = 1;
  int64 target_user_id = 2;
  string memo = 3;
}

message GetUserMemoRequest {
  int64 user_id = 1;
  int64 target_user_id = 2;
}

message UserMemoResponse {
  bool success = 1;
  string message = 2;
  string memo = 3;
}

message ChangePasswordRequest {
  int64 id = 1;
  string old_password = 2;
  string new_password = 3;
  string mfa_code = 4;
}

message PasswordResetRequest {
  string email = 1;
}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

message EmailVerificationRequest {
  int64 user_id = 1;
}

message VerifyEmailRequest {
  string token = 1;
}

message UpdateStatusRequest {
  int64 id = 1;
  int32 status = 2;
}

message UserIDRequest {
  int64 id = 1;
}

message UsernameRequest {
  string username = 1;
}

message FollowRequest {
  int64 follower_id = 1;
  int64 followee_id = 2;
  optional bool with_replies = 3;
}

message ListFollowsRequest {
  int64 user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  int64 after_user_id = 4;
  bool ascending_by_user_id = 5;
}

// FollowResponse reports whether the follow was applied immediately or parked as
// a pending request because the target requires approval.
message FollowResponse {
  bool success = 1;
  string message = 2;
  bool pending = 3;
}

message FollowRequestActionRequest {
  // ActorId is the account performing the action: the target for accept/reject,
  // the requester for cancel.
  int64 actor_id = 1;
  int64 counterpart_id = 2;
}

message ListFollowRequestsRequest {
  int64 actor_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  int64 since_id = 4;
  int64 until_id = 5;
  int32 limit = 6;
}

message FollowRequestInfo {
  int64 id = 1;
  int64 requester_id = 2;
  int64 target_id = 3;
  int64 created_at = 4;
  // Counterpart is the other side of the request: the requester when listing
  // received requests, the target when listing sent ones.
  UserInfo counterpart = 5;
  bool with_replies = 6;
}

message FollowRequestListResponse {
  repeated FollowRequestInfo items = 1;
  int64 total = 2;
}

message SetFollowApprovalRequest {
  int64 user_id = 1;
  bool required = 2;
}

message UserRelationRequest {
  int64 actor_id = 1;
  int64 target_id = 2;
}

message ListUserRelationsRequest {
  int64 actor_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  int64 after_target_id = 4;
  bool ascending_by_target_id = 5;
}

message ListUsersRequest {
  string query = 1;
  int32 status = 2; // 0 means all statuses.
  int32 page = 3;
  int32 page_size = 4;
  repeated int64 ids = 5;
  repeated string usernames = 6;
}

message UserResponse {
  bool success = 1;
  string message = 2;
  UserInfo user = 3;
}

message CredentialVersionResponse {
  int64 user_id = 1;
  string credential_version = 2;
}

message UserListResponse {
  repeated UserInfo items = 1;
  int64 total = 2;
}

message UserListInfo {
  int64 id = 1;
  int64 owner_id = 2;
  string name = 3;
  bool is_public = 4;
  int64 member_count = 5;
  int64 favorite_count = 6;
  bool is_favorited = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
}

message UserListInfoResponse {
  bool success = 1;
  string message = 2;
  UserListInfo user_list = 3;
}

message UserListsResponse {
  repeated UserListInfo items = 1;
  int64 total = 2;
}

message AntennaInfo {
  int64 id = 1;
  int64 owner_id = 2;
  string name = 3;
  string source = 4;
  int64 user_list_id = 5;
  repeated AntennaKeywordGroup keywords = 6;
  repeated AntennaKeywordGroup exclude_keywords = 7;
  repeated string users = 8;
  bool case_sensitive = 9;
  bool local_only = 10;
  bool exclude_bots = 11;
  bool with_replies = 12;
  bool with_file = 13;
  bool exclude_notes_in_sensitive_channel = 14;
  bool is_active = 15;
  int64 created_at = 16;
  int64 updated_at = 17;
  int64 last_used_at = 18;
}

message AntennaInfoResponse {
  AntennaInfo antenna = 1;
}

message AntennaListResponse {
  repeated AntennaInfo items = 1;
  int64 total = 2;
}

message AuthResponse {
  bool success = 1;
  string message = 2;
  UserInfo user = 3;
  string access_token = 4;
  int64 expires_at = 5;
  bool mfa_required = 6;
  string mfa_challenge = 7;
  int64 mfa_expires_at = 8;
}

message MFAStatusResponse {
  bool enabled = 1;
  int64 recovery_codes_remaining = 2;
  int64 enabled_at = 3;
}

message TOTPEnrollmentResponse {
  string secret = 1;
  string otpauth_url = 2;
  string qr_data_url = 3;
  string issuer = 4;
  string account = 5;
}

message MFARecoveryCodesResponse {
  repeated string recovery_codes = 1;
}

message PasskeyInfo {
  string credential_id = 1;
  string name = 2;
  bool backup_eligible = 3;
  bool backup_state = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
  int64 last_used_at = 7;
}

message PasskeyListResponse {
  repeated PasskeyInfo items = 1;
  bool passwordless_enabled = 2;
  int32 limit = 3;
}

message PasskeyInfoResponse {
  bool success = 1;
  string message = 2;
  PasskeyInfo passkey = 3;
}

message PasskeyOptionsResponse {
  string challenge = 1;
  string options_json = 2;
  int64 expires_at = 3;
}

message AccountDeletionJobInfo {
  int64 id = 1;
  string status = 2;
  int32 policy_version = 3;
  int32 completed_steps = 4;
  int32 total_steps = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
  int64 started_at = 8;
  int64 completed_at = 9;
}

message AccountLifecycleResponse {
  int64 user_id = 1;
  string state = 2;
  int64 state_version = 3;
  bool protected = 4;
  int64 deletion_requested_at = 5;
  int64 deleted_at = 6;
  AccountDeletionJobInfo active_deletion_job = 7;
}

message PasswordResetResponse {
  bool accepted = 1;
  reserved 2;
  int64 expires_at = 3;
}

message EmailVerificationResponse {
  bool accepted = 1;
  string verification_token = 2;
  int64 expires_at = 3;
  bool already_verified = 4;
}

message IsFollowingResponse {
  bool following = 1;
  bool pending = 2;
}

message SafetyRelationResponse {
  bool blocked = 1;
  bool blocked_by = 2;
  bool muted = 3;
}

message InviteCodeInfo {
  int64 id = 1;
  string code = 2;
  int64 created_by_admin_id = 3;
  int64 used_by_user_id = 4;
  int64 expires_at = 5; // Unix seconds; 0 means unset.
  int64 used_at = 6; // Unix seconds; 0 means unset.
  int64 revoked_at = 7; // Unix seconds; 0 means unset.
  int64 revoked_by_admin_id = 8;
  int64 created_at = 9; // Unix seconds.
  string status = 10;
}

message InviteCodeListResponse {
  repeated InviteCodeInfo items = 1;
  int64 total = 2;
}

message RegistryDomain {
  string value = 1;
}

message RegistryItemInfo {
  string id = 1;
  int64 user_id = 2;
  RegistryDomain domain = 3;
  repeated string scope = 4;
  string key = 5;
  bytes value_json = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
}

message SetRegistryItemRequest {
  int64 user_id = 1;
  RegistryDomain domain = 2;
  repeated string scope = 3;
  string key = 4;
  bytes value_json = 5;
}

message GetRegistryItemRequest {
  int64 user_id = 1;
  RegistryDomain domain = 2;
  repeated string scope = 3;
  string key = 4;
}

message ListRegistryItemsRequest {
  int64 user_id = 1;
  RegistryDomain domain = 2;
  repeated string scope = 3;
}

message RegistryItemResponse {
  RegistryItemInfo item = 1;
}

message RegistryItemListResponse {
  repeated RegistryItemInfo items = 1;
}

message RegistryScopeDomainInfo {
  RegistryDomain domain = 1;
  repeated RegistryScope scopes = 2;
}

message RegistryScope {
  repeated string segments = 1;
}

message RegistryScopeDomainListResponse {
  repeated RegistryScopeDomainInfo items = 1;
}

message SessionClientInfo {
  string ip_address = 1;
  string user_agent = 2;
}

message SessionInfo {
  string session_id = 1;
  int64 user_id = 2;
  string ip_address = 3;
  string user_agent = 4;
  string login_method = 5;
  int64 created_at = 6;
  int64 expires_at = 7;
  int64 revoked_at = 8;
}

message LoginEventInfo {
  string id = 1;
  int64 user_id = 2;
  string session_id = 3;
  string ip_address = 4;
  string user_agent = 5;
  bool success = 6;
  string failure_reason = 7;
  int64 created_at = 8;
}

message ListSessionsRequest {
  int64 user_id = 1;
  int32 limit = 2;
}

message GetSessionRequest {
  int64 user_id = 1;
  string session_id = 2;
}

message RevokeSessionRequest {
  int64 user_id = 1;
  string session_id = 2;
}

message ListLoginEventsRequest {
  int64 user_id = 1;
  int32 limit = 2;
  int64 after_id = 3;
  bool ascending_by_id = 4;
}

message SessionListResponse {
  repeated SessionInfo items = 1;
  int64 total = 2;
}

message SessionResponse {
  SessionInfo session = 1;
}

message LoginEventListResponse {
  repeated LoginEventInfo items = 1;
  int64 total = 2;
}

message APITokenInfo {
  string id = 1;
  int64 user_id = 2;
  string name = 3;
  repeated string scopes = 4;
  int64 created_at = 5;
  int64 expires_at = 6;
  int64 revoked_at = 7;
  bool credential_valid = 8;
}

message CreateAPITokenRequest {
  int64 user_id = 1;
  string name = 2;
  repeated string scopes = 3;
  int32 expires_in_days = 4;
  SessionClientInfo client = 5;
}

message CreateAPITokenResponse {
  string token = 1;
  APITokenInfo api_token = 2;
}

message ListAPITokensRequest {
  int64 user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message RevokeAPITokenRequest {
  int64 user_id = 1;
  string token_id = 2;
}

message APITokenListResponse {
  repeated APITokenInfo items = 1;
  int64 total = 2;
}

message APITokenResponse {
  APITokenInfo api_token = 1;
}
message SimpleResponse {
  bool success = 1;
  string message = 2;
}

message UserChartRequest {
  string span = 1;
  int32 limit = 2;
  optional int64 offset = 3; // Unix milliseconds; absent means the current bucket.
}

message UserChartSeries {
  repeated int64 total = 1;
  repeated int64 inc = 2;
  repeated int64 dec = 3;
}

message UserChartResponse {
  UserChartSeries local = 1;
  UserChartSeries remote = 2;
}

message UserFollowingChartRequest {
  string span = 1;
  int32 limit = 2;
  optional int64 offset = 3; // Unix milliseconds; absent means the current bucket.
  int64 user_id = 4;
}

message UserFollowingChartScope {
  UserChartSeries followings = 1;
  UserChartSeries followers = 2;
}

message UserFollowingChartResponse {
  UserFollowingChartScope local = 1;
  UserFollowingChartScope remote = 2;
}

message ActiveUsersChartRequest {
  string span = 1;
  int32 limit = 2;
  optional int64 offset = 3;
}

message ActiveUsersChartBucket {
  repeated int64 read_user_ids = 1;
  int64 registered_within_week = 2;
  int64 registered_within_month = 3;
  int64 registered_within_year = 4;
  int64 registered_outside_week = 5;
  int64 registered_outside_month = 6;
  int64 registered_outside_year = 7;
}

message ActiveUsersChartResponse {
  repeated ActiveUsersChartBucket buckets = 1;
}

message GetFollowingRequest {
  int64 follower_id = 1;
  int64 followee_id = 2;
}

message UpdateFollowingRequest {
  int64 follower_id = 1;
  int64 followee_id = 2;
  optional bool with_replies = 3;
  optional string notify = 4;
}

message UpdateAllFollowingsRequest {
  int64 follower_id = 1;
  optional bool with_replies = 2;
  optional string notify = 3;
}

message ListFollowingEdgesRequest {
  int64 user_id = 1;
  int64 since_id = 2;
  int64 until_id = 3;
  int32 limit = 4;
  int64 viewer_id = 5;
  string birthday_mmdd = 6;
}

message FollowingInfo {
  int64 id = 1;
  int64 follower_id = 2;
  int64 followee_id = 3;
  bool with_replies = 4;
  string notify = 5;
  int64 created_at = 6;
  UserInfo follower = 7;
  UserInfo followee = 8;
}

message FollowingResponse {
  FollowingInfo following = 1;
}

message FollowingListResponse {
  repeated FollowingInfo items = 1;
}

message ListNoteNotificationSubscribersRequest {
  int64 followee_id = 1;
  int64 since_id = 2;
  int32 limit = 3;
}

message NoteNotificationSubscriber {
  int64 edge_id = 1;
  int64 user_id = 2;
}

message NoteNotificationSubscribersResponse {
  repeated NoteNotificationSubscriber items = 1;
}
