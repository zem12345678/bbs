service:
  name: bbs-user-service
  grpcPort: 9102

app:
  name: bbs-user-service

nacos:
  addr: "127.0.0.1"
  port: 8848
  namespaceId: bbs-local
  dataId: "bbs-user-service.yaml"
  groupId: "BBS_LOCAL"

log:
  filename: logs/user-service.log
  maxSize: 100
  maxBackups: 7
  maxAge: 30
  level: info
  stdout: true

postgres:
  # Override in production with BBS_USER_POSTGRES_DSN.
  dsn: postgres://bbs_user_app:local_user_pass@127.0.0.1:5432/bbs?sslmode=disable&search_path=bbs_user
  debug: false
  max_open_conns: 1

redis:
  url: "127.0.0.1:6379"
  dbNum: 0
  password: ""
  maxIdle: 10
  maxActive: 100
  idleTimeout: 10
  timeout: 5
  network: "tcp"

kafka:
  # Override in production with comma-separated BBS_USER_KAFKA_BROKERS.
  brokers:
    - 127.0.0.1:9092
  topic: user.events

snowflake:
  workerId: 2

jwt:
  # Override in production with BBS_USER_JWT_SECRET.
  secret: ""
  ttl: 168h

password:
  minLength: 8

mail:
  # Security emails use Mailpit locally. Override all BBS_USER_MAIL_* values in production.
  enabled: true
  smtpAddr: 127.0.0.1:1025
  from: noreply@bbs.local
  frontendBaseURL: http://127.0.0.1:8850
  tlsMode: none
  timeout: 10s

upstreams:
  mall: bbs-mall-service
  # Must match mall-service grpc.server.internalAuthToken.
  mallInternalAuthToken: ""

grpc:
  server:
    port: 9102
    etcdAddr:
      - "127.0.0.1:2379"
    serviceName: "bbs-user-service"
    timeout: 10s
    # Override in production with BBS_USER_GRPC_SERVER_INTERNAL_AUTH_TOKEN.
    internalAuthToken: ""
  client:
    timeout: 10s
    tag: "user"
    etcdAddr:
      - "127.0.0.1:2379"
    serverName: "bbs-user-service"
    secure: false

trace:
  grpcEndpoint: 127.0.0.1:4317
  serviceName: bbs-user-service
  version: local
  env: local
