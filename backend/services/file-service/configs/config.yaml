service:
  name: bbs-file-service
  grpcPort: 9111

app:
  name: bbs-file-service

nacos:
  addr: "127.0.0.1"
  port: 8848
  namespaceId: bbs-local
  dataId: "bbs-file-service.yaml"
  groupId: "BBS_LOCAL"

postgres:
  dsn: postgres://bbs_file_app:local_file_pass@127.0.0.1:5432/bbs?sslmode=disable&search_path=bbs_file
  max_open_conns: 1

files:
  # Per-user quota across ACTIVE and DELETING generic files, including managed media.
  capacityBytes: 104857600

storage:
  provider: minio
  endpoint: http://127.0.0.1:9000
  bucket: bbs-local
  accessKey: ""
  secretKey: ""

upstreams:
  credit: bbs-credit-service
  # Must match credit-service grpc.server.internalAuthToken.
  creditInternalAuthToken: ""
  content: bbs-content-service
  # Must match content-service grpc.server.internalAuthToken.
  contentInternalAuthToken: ""
  mall: bbs-mall-service
  # Must match mall-service grpc.server.internalAuthToken.
  mallInternalAuthToken: ""

grpc:
  server:
    port: 9111
    etcdAddr:
      - "127.0.0.1:2379"
    serviceName: "bbs-file-service"
    # Must match api-gateway upstreams.fileInternalAuthToken.
    internalAuthToken: ""
  client:
    etcdAddr:
      - "127.0.0.1:2379"
