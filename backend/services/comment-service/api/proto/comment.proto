syntax = "proto3";

package bbs.comment.v1;

option go_package = "comment-service/api/proto/commentpb;commentpb";

service CommentService {
  rpc CreateComment(CreateCommentRequest) returns (CommentResponse);
  rpc DeleteComment(DeleteCommentRequest) returns (SimpleResponse);
  rpc RestoreComment(RestoreCommentRequest) returns (SimpleResponse);
  rpc GetComment(GetCommentRequest) returns (CommentResponse);
  rpc ListComments(ListCommentsRequest) returns (CommentListResponse);
  rpc ListReplies(ListRepliesRequest) returns (CommentListResponse);
  rpc ListRecentComments(ListRecentCommentsRequest) returns (CommentListResponse);
  rpc RedactAccountComments(RedactAccountCommentsRequest) returns (RedactAccountCommentsResponse);
  rpc GetNoteChart(NoteChartRequest) returns (NoteChartResponse);
  rpc GetActiveUsersChart(ActiveUsersChartRequest) returns (ActiveUsersChartResponse);
}

message RedactAccountCommentsRequest {
  int64 user_id = 1;
  int64 deletion_job_id = 2;
  int32 policy_version = 3;
}

message RedactAccountCommentsResponse {
  bool completed = 1;
  int64 redacted_comments = 2;
}

message CommentInfo {
  int64 id = 1;
  string entity_type = 2;
  int64 entity_id = 3;
  int64 root_id = 4;
  int64 parent_id = 5;
  int64 author_id = 6;
  string content = 7;
  int32 status = 8;
  int64 reply_count = 9;
  int64 like_count = 10;
  int64 created_at = 11;
  int64 updated_at = 12;
}

message CreateCommentRequest {
  string entity_type = 1;
  int64 entity_id = 2;
  int64 parent_id = 3;
  int64 author_id = 4;
  string content = 5;
}

message DeleteCommentRequest {
  int64 id = 1;
  int64 actor_id = 2;
  bool moderator = 3;
}

message RestoreCommentRequest {
  int64 id = 1;
  int64 actor_id = 2;
  bool moderator = 3;
}

message GetCommentRequest {
  int64 id = 1;
}

message ListCommentsRequest {
  string entity_type = 1;
  int64 entity_id = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListRepliesRequest {
  int64 root_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListRecentCommentsRequest {
  string entity_type = 1;
  int64 entity_id = 2;
  int64 author_id = 3;
  int32 status = 4; // -1 means all statuses, 0 hidden, 1 visible.
  int32 page = 5;
  int32 page_size = 6;
}

message CommentResponse {
  bool success = 1;
  string message = 2;
  CommentInfo comment = 3;
}

message CommentListResponse {
  repeated CommentInfo items = 1;
  int64 total = 2;
}

message SimpleResponse {
  bool success = 1;
  string message = 2;
}

message NoteChartRequest {
  string span = 1;
  int32 limit = 2;
  optional int64 offset = 3; // Unix milliseconds; absent means the current bucket.
  int64 user_id = 4; // Zero returns the instance-wide chart.
}

message NoteChartDiffs {
  repeated int64 normal = 1;
  repeated int64 reply = 2;
  repeated int64 renote = 3;
  repeated int64 with_file = 4;
}

message NoteChartSeries {
  repeated int64 total = 1;
  repeated int64 inc = 2;
  repeated int64 dec = 3;
  NoteChartDiffs diffs = 4;
}

message NoteChartResponse {
  NoteChartSeries local = 1;
  NoteChartSeries remote = 2;
}

message ActiveUsersChartRequest {
  string span = 1;
  int32 limit = 2;
  optional int64 offset = 3;
}

message ActiveUsersChartBucket {
  repeated int64 writer_user_ids = 1;
}

message ActiveUsersChartResponse {
  repeated ActiveUsersChartBucket buckets = 1;
}
