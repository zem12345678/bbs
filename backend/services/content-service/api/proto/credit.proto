syntax = "proto3";

package bbs.credit.v1;

option go_package = "content-service/api/proto/creditpb;creditpb";

service CreditService {
  rpc GetBalance(GetBalanceRequest) returns (BalanceResponse);
}

message Balance {
  int64 user_id = 1;
  int64 total = 2;
  int64 updated_at = 3;
}

message GetBalanceRequest {
  int64 user_id = 1;
}

message BalanceResponse {
  Balance balance = 1;
}
