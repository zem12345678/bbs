service:
  name: bbs-api-gateway
  httpPort: 18080

app:
  name: bbs-api-gateway

nacos:
  addr: "127.0.0.1"
  port: 8848
  namespaceId: bbs-local
  dataId: "bbs-api-gateway.yaml"
  groupId: "BBS_LOCAL"

log:
  filename: logs/local-out.log
  maxSize: 100
  maxBackups: 7
  maxAge: 30
  level: debug
  stdout: true

trace:
  grpcEndpoint: 127.0.0.1:4317
  serviceName: bbs-api-gateway
  version: local
  env: local

grpc:
  client:
    timeout: 10s
    tag: "bbs-api-gateway"
    etcdAddr:
      - "127.0.0.1:2379"
    serverName: "bbs-api-gateway"
    secure: false
    tls:
      caFile: ""
      certFile: ""
      keyFile: ""
      serverName: ""

auth:
  tokenHeader: Authorization
  tokenPrefix: Bearer
  # Override in production with BBS_GATEWAY_AUTH_JWT_SECRET.
  jwtSecret: ""
  rateLimit:
    registerInterval: 1h
    registerRate: 5
    loginInterval: 1m
    loginRate: 10
    passwordResetInterval: 15m
    passwordResetRate: 5
    passwordResetConfirmInterval: 15m
    passwordResetConfirmRate: 5
    emailVerificationInterval: 15m
    emailVerificationRate: 5
    adminLoginInterval: 15m
    adminLoginRate: 5

search:
  rateLimit:
    contentInterval: 1m
    contentRate: 60
    userInterval: 1m
    userRate: 10

files:
  rateLimit:
    uploadInterval: 1m
    uploadRate: 10

http:
  # Local default. Containers should set BBS_GATEWAY_HTTP_HOST=0.0.0.0.
  host: "127.0.0.1"
  publicBaseURL: "http://127.0.0.1:18080"
  # Empty disables trust in forwarded client-IP headers. Set known reverse-proxy CIDRs in production.
  trustedProxies: []
  pprofEnabled: false

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

chat:
  rateLimit:
    createRoomInterval: 1m
    createRoomRate: 5
    ticketInterval: 1m
    ticketRate: 10
    subscribeInterval: 1m
    subscribeRate: 10
    joinInterval: 1m
    joinRate: 10
    sendInterval: 1s
    sendRate: 5
    readInterval: 1m
    readRate: 60
  websocket:
    maxConnectionsPerUser: 5
    maxConnectionsPerIP: 50

cors:
  # Override in production with comma-separated BBS_GATEWAY_CORS_ALLOWED_ORIGINS.
  allowedOrigins:
    - http://127.0.0.1:8850
    - http://localhost:8850
    - http://127.0.0.1:8851
    - http://localhost:8851
    - http://127.0.0.1:5173
    - http://localhost:5173
    - http://127.0.0.1:8848
    - http://localhost:8848
    - http://127.0.0.1:8849
    - http://localhost:8849

upstreams:
  admin: bbs-admin-service
  adminInternalAuthToken: ""
  adminInternalAuthSecure: false
  user: bbs-user-service
  userInternalAuthToken: ""
  userInternalAuthSecure: false
  content: bbs-content-service
  contentInternalAuthToken: ""
  comment: bbs-comment-service
  commentInternalAuthToken: ""
  reaction: bbs-reaction-service
  reactionInternalAuthToken: ""
  search: bbs-search-service
  searchInternalAuthToken: ""
  feed: bbs-feed-service
  feedInternalAuthToken: ""
  credit: bbs-credit-service
  creditInternalAuthToken: ""
  creditInternalAuthSecure: false
  mall: bbs-mall-service
  mallInternalAuthToken: ""
  mallInternalAuthSecure: false
  notification: bbs-notification-service
  notificationInternalAuthToken: ""
  file: bbs-file-service
  fileInternalAuthToken: ""
  fileInternalAuthSecure: false
  chat: bbs-chat-service
  chatInternalAuthToken: ""
  chatInternalAuthSecure: false
