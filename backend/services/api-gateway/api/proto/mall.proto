  int64 refund_id = 1;
  bool approved = 2;
  string operator_id = 3;
  string admin_note = 4;
  bool restore_stock = 5;
}

enum ProductStatus {
  PRODUCT_STATUS_UNSPECIFIED = 0;
  PRODUCT_STATUS_DRAFT = 1;
  PRODUCT_STATUS_ACTIVE = 2;
  PRODUCT_STATUS_ARCHIVED = 3;
}

enum ProductCategoryStatus {
  PRODUCT_CATEGORY_STATUS_UNSPECIFIED = 0;
  PRODUCT_CATEGORY_STATUS_DRAFT = 1;
  PRODUCT_CATEGORY_STATUS_ACTIVE = 2;
  PRODUCT_CATEGORY_STATUS_ARCHIVED = 3;
}

enum ProductReviewStatus {
  PRODUCT_REVIEW_STATUS_UNSPECIFIED = 0;
  PRODUCT_REVIEW_STATUS_PENDING = 1;
  PRODUCT_REVIEW_STATUS_PUBLISHED = 2;
  PRODUCT_REVIEW_STATUS_HIDDEN = 3;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING_PAYMENT = 1;
  ORDER_STATUS_PAYING = 2;
  ORDER_STATUS_PAID = 3;
  ORDER_STATUS_CANCELED = 4;
  ORDER_STATUS_SHIPPED = 5;
  ORDER_STATUS_COMPLETED = 6;
  ORDER_STATUS_CLOSED = 7;
  ORDER_STATUS_REFUNDED = 8;
}

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_PENDING = 1;
  PAYMENT_STATUS_SUCCEEDED = 2;
  PAYMENT_STATUS_FAILED = 3;
}

enum RefundStatus {
  REFUND_STATUS_UNSPECIFIED = 0;
  REFUND_STATUS_REQUESTED = 1;
  REFUND_STATUS_PROCESSING = 2;
