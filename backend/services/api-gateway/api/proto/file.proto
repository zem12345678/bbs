syntax = "proto3";

package bbs.file.v1;

option go_package = "api-gateway/api/proto/filepb;filepb";

service FileService {
  rpc CreateAttachment(CreateAttachmentRequest) returns (AttachmentResponse);
  rpc GetAttachment(GetAttachmentRequest) returns (AttachmentResponse);
  rpc ListTopicAttachments(ListTopicAttachmentsRequest) returns (AttachmentListResponse);
  rpc ListOwnedTopicAttachments(ListOwnedTopicAttachmentsRequest) returns (AttachmentListResponse);
  rpc ListOwnedAttachments(ListOwnedAttachmentsRequest) returns (AttachmentListResponse);
  rpc ListUserAttachmentDownloads(ListUserAttachmentDownloadsRequest) returns (AttachmentDownloadListResponse);
  rpc ListUserAttachmentSales(ListUserAttachmentSalesRequest) returns (AttachmentSaleListResponse);
  rpc AuthorizeAttachmentDownload(AuthorizeAttachmentDownloadRequest) returns (DownloadAuthorizationResponse);
  rpc ArchiveAttachment(ArchiveAttachmentRequest) returns (AttachmentResponse);
  rpc UpdateAttachmentPrice(UpdateAttachmentPriceRequest) returns (AttachmentResponse);
  rpc CreateFile(CreateFileRequest) returns (FileResponse);
  rpc ListFiles(ListFilesRequest) returns (FileListResponse);
  rpc GetFileUsage(GetFileUsageRequest) returns (FileUsageResponse);
  rpc SetFileCapacity(SetFileCapacityRequest) returns (FileUsageResponse);
  rpc GetFile(GetFileRequest) returns (FileResponse);
  rpc DeleteFile(DeleteFileRequest) returns (FileResponse);
  rpc ListFolders(ListFoldersRequest) returns (FolderListResponse);
  rpc CreateFolder(CreateFolderRequest) returns (FolderResponse);
  rpc UpdateFolder(UpdateFolderRequest) returns (FolderResponse);
  rpc DeleteFolder(DeleteFolderRequest) returns (FolderResponse);
  rpc UpdateFile(UpdateFileRequest) returns (FileResponse);
  rpc GetDriveChart(DriveChartRequest) returns (DriveChartResponse);
}

message Attachment {
  int64 id = 1;
  int64 topic_id = 2;
  int64 owner_id = 3;
  string object_key = 4;
  string original_name = 5;
  string content_type = 6;
  int64 size_bytes = 7;
  int64 price_credits = 8;
  string status = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
  int64 archived_at = 12;
}

message CreateAttachmentRequest {
  int64 topic_id = 1;
  int64 owner_id = 2;
  string object_key = 3;
  string original_name = 4;
  string content_type = 5;
  int64 size_bytes = 6;
  int64 price_credits = 7;
}

message AttachmentResponse {
  Attachment attachment = 1;
}

message GetAttachmentRequest {
  int64 attachment_id = 1;
}

message ListTopicAttachmentsRequest {
  int64 topic_id = 1;
}

message AttachmentListResponse {
  repeated Attachment items = 1;
}

message ListUserAttachmentDownloadsRequest {
  int64 user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
  // Optional. When present, returns only downloads for attachments that
  // belong to this topic. It lets a topic page reconcile paid-download
  // entitlement without scanning the member's full download history.
  int64 topic_id = 4;
}

message AttachmentDownload {
  Attachment attachment = 1;
  string status = 2;
  int64 charged_credits = 3;
  int64 created_at = 4;
  int64 authorized_at = 5;
}

message AttachmentDownloadListResponse {
  repeated AttachmentDownload items = 1;
  int64 total = 2;
}

message ListUserAttachmentSalesRequest {
  int64 user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message AttachmentSale {
  Attachment attachment = 1;
  int64 earned_credits = 2;
  int64 sold_at = 3;
}

message AttachmentSaleListResponse {
  repeated AttachmentSale items = 1;
  int64 total = 2;
  int64 total_earned_credits = 3;
}

message AuthorizeAttachmentDownloadRequest {
  int64 attachment_id = 1;
  int64 user_id = 2;
}

message DownloadAuthorizationResponse {
  Attachment attachment = 1;
  bool already_authorized = 2;
  int64 charged_credits = 3;
}

message ArchiveAttachmentRequest {
  int64 attachment_id = 1;
  int64 owner_id = 2;
}

message UpdateAttachmentPriceRequest {
  int64 attachment_id = 1;
  int64 owner_id = 2;
  int64 price_credits = 3;
}

message File {
  int64 id = 1;
  int64 owner_id = 2;
  string biz_type = 3;
  string object_key = 4;
  string original_name = 5;
  string content_type = 6;
  int64 size_bytes = 7;
  string status = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
  int64 deleted_at = 11;
  int64 folder_id = 12;
  bool is_sensitive = 13;
  string comment = 14;
}

message CreateFileRequest {
  int64 owner_id = 1;
  string biz_type = 2;
  string object_key = 3;
  string original_name = 4;
  string content_type = 5;
  int64 size_bytes = 6;
  int64 folder_id = 7;
}

message FileResponse {
  File file = 1;
}

message ListFilesRequest {
  int64 owner_id = 1;
  int32 limit = 2;
  int32 offset = 3;
  optional int64 folder_id = 4;
  int64 after_id = 5;
  bool ascending_by_id = 6;
}

message FileListResponse {
  repeated File items = 1;
  int64 total = 2;
}

message GetFileUsageRequest {
  int64 owner_id = 1;
}

message FileUsageResponse {
  int64 used_bytes = 1;
  int64 capacity_bytes = 2;
  int64 remaining_bytes = 3;
  int64 file_count = 4;
  int64 policy_capacity_bytes = 5;
  int64 max_file_size_bytes = 6;
  int64 override_capacity_bytes = 7;
  bool has_override = 8;
}

message SetFileCapacityRequest {
  int64 owner_id = 1;
  int64 override_capacity_bytes = 2;
  bool clear_override = 3;
}

message GetFileRequest {
  int64 owner_id = 1;
  int64 file_id = 2;
}

message DeleteFileRequest {
  int64 owner_id = 1;
  int64 file_id = 2;
}

message Folder {
  int64 id = 1;
  int64 owner_id = 2;
  string name = 3;
  int64 parent_id = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
  int64 folders_count = 7;
  int64 files_count = 8;
}

message ListFoldersRequest {
  int64 owner_id = 1;
  int64 parent_id = 2;
  int32 limit = 3;
  int32 offset = 4;
  string search_query = 5;
}

message FolderListResponse {
  repeated Folder items = 1;
  int64 total = 2;
}

message CreateFolderRequest {
  int64 owner_id = 1;
  string name = 2;
  int64 parent_id = 3;
}

message UpdateFolderRequest {
  int64 owner_id = 1;
  int64 folder_id = 2;
  optional string name = 3;
  optional int64 parent_id = 4;
}

message DeleteFolderRequest {
  int64 owner_id = 1;
  int64 folder_id = 2;
}

message FolderResponse {
  Folder folder = 1;
}

message UpdateFileRequest {
  int64 owner_id = 1;
  int64 file_id = 2;
  optional string name = 3;
  optional int64 folder_id = 4;
  optional bool is_sensitive = 5;
  optional string comment = 6;
}

message DriveChartRequest {
  string span = 1;
  int32 limit = 2;
  optional int64 offset = 3;
  int64 owner_id = 4;
}

message DriveChartSeries {
  repeated int64 total_count = 1;
  repeated double total_size = 2;
  repeated int64 inc_count = 3;
  repeated double inc_size = 4;
  repeated int64 dec_count = 5;
  repeated double dec_size = 6;
}

message DriveChartResponse {
  DriveChartSeries local = 1;
  DriveChartSeries remote = 2;
}

message ListOwnedTopicAttachmentsRequest {
  int64 topic_id = 1;
  int64 owner_id = 2;
}

message ListOwnedAttachmentsRequest {
  int64 owner_id = 1;
  int64 after_id = 2;
  int32 limit = 3;
  bool ascending_by_id = 4;
}
