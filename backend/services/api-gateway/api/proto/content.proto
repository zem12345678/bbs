syntax = "proto3";

package bbs.content.v1;

option go_package = "api-gateway/api/proto/contentpb;contentpb";

service ContentService {
  rpc CreateTopic(CreateTopicRequest) returns (TopicResponse);
  rpc UpdateTopic(UpdateTopicRequest) returns (TopicResponse);
  rpc PublishTopic(TopicIDRequest) returns (TopicResponse);
  rpc HideTopic(TopicIDRequest) returns (TopicResponse);
  rpc ArchiveTopic(TopicIDRequest) returns (TopicResponse);
  rpc AcceptTopicComment(AcceptTopicCommentRequest) returns (TopicResponse);
  rpc UnacceptTopicComment(UnacceptTopicCommentRequest) returns (TopicResponse);
  rpc GetTopic(GetTopicRequest) returns (TopicResponse);
  rpc ListTopics(ListTopicsRequest) returns (TopicListResponse);
  rpc CreateArticle(CreateArticleRequest) returns (ArticleResponse);
  rpc UpdateArticle(UpdateArticleRequest) returns (ArticleResponse);
  rpc PublishArticle(ArticleIDRequest) returns (ArticleResponse);
  rpc HideArticle(ArticleIDRequest) returns (ArticleResponse);
  rpc ArchiveArticle(ArticleIDRequest) returns (ArticleResponse);
  rpc GetArticle(GetArticleRequest) returns (ArticleResponse);
  rpc ListArticles(ListArticlesRequest) returns (ArticleListResponse);
  rpc FeedArticlesByTime(FeedArticlesByTimeRequest) returns (ArticleListResponse);
  rpc ListCategories(ListCategoriesRequest) returns (CategoryListResponse);
  rpc GetCategory(CategoryIDRequest) returns (CategoryResponse);
  rpc CreateCategory(UpsertCategoryRequest) returns (CategoryResponse);
  rpc UpdateCategory(UpsertCategoryRequest) returns (CategoryResponse);
  rpc DeleteCategory(CategoryIDRequest) returns (CategoryResponse);
  rpc ListTags(ListTagsRequest) returns (TagListResponse);
  rpc AutocompleteTags(AutocompleteTagsRequest) returns (TagListResponse);
}

message TopicInfo {
  int64 id = 1;
  string slug = 2;
  string type = 3;
  string title = 4;
  string body = 5;
  repeated string tags = 6;
  int64 author_id = 7;
  int32 status = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
  int64 published_at = 11;
  int64 category_id = 12;
  int64 view_count = 13;
  int64 bounty_score = 14;
  string qa_status = 15;
  int64 accepted_comment_id = 16;
}

message ArticleInfo {
  int64 id = 1;
  string slug = 2;
  string title = 3;
  string summary = 4;
  string body = 5;
  string cover_url = 6;
  repeated string tags = 7;
  int64 author_id = 8;
  int32 status = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
  int64 published_at = 12;
  int64 view_count = 13;
}

message TopicResponse {
  bool success = 1;
  string message = 2;
  TopicInfo topic = 3;
}

message TopicListResponse {
  repeated TopicInfo items = 1;
  int64 total = 2;
}

message ArticleResponse {
  bool success = 1;
  string message = 2;
  ArticleInfo article = 3;
}

message ArticleListResponse {
  repeated ArticleInfo items = 1;
  int64 total = 2;
}

message TagInfo {
  string name = 1;
  int64 count = 2;
}

message TagListResponse {
  repeated TagInfo items = 1;
}

message CategoryInfo {
  int64 id = 1;
  string slug = 2;
  string name = 3;
  string description = 4;
  int32 sort = 5;
  int32 status = 6;
  int64 topic_count = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
}

message CategoryResponse {
  bool success = 1;
  string message = 2;
  CategoryInfo category = 3;
}

message CategoryListResponse {
  repeated CategoryInfo items = 1;
}

message CreateTopicRequest {
  string slug = 1;
  string type = 2;
  string title = 3;
  string body = 4;
  repeated string tags = 5;
  int64 author_id = 6;
  int64 category_id = 7;
  int64 bounty_score = 8;
}

message UpdateTopicRequest {
  int64 id = 1;
  string title = 2;
  string body = 3;
  repeated string tags = 4;
  int64 category_id = 5;
  int64 bounty_score = 6;
}

message TopicIDRequest {
  int64 id = 1;
}

message AcceptTopicCommentRequest {
  int64 topic_id = 1;
  int64 comment_id = 2;
  int64 user_id = 3;
}

message UnacceptTopicCommentRequest {
  int64 topic_id = 1;
  int64 comment_id = 2;
  int64 user_id = 3;
}

message GetTopicRequest {
  oneof key {
    int64 id = 1;
    string slug = 2;
  }
  bool track_view = 3;
}

message ListTopicsRequest {
  int32 status = 1;
  string type = 2;
  string tag = 3;
  int64 author_id = 4;
  int32 limit = 5;
  int32 offset = 6;
  int64 category_id = 7;
  string sort = 8;
}

message CreateArticleRequest {
  string slug = 1;
  string title = 2;
  string summary = 3;
  string body = 4;
  string cover_url = 5;
  repeated string tags = 6;
  int64 author_id = 7;
}

message UpdateArticleRequest {
  int64 id = 1;
  string title = 2;
  string summary = 3;
  string body = 4;
  string cover_url = 5;
  repeated string tags = 6;
}

message ArticleIDRequest {
  int64 id = 1;
}

message GetArticleRequest {
  oneof key {
    int64 id = 1;
    string slug = 2;
  }
  bool track_view = 3;
}

message ListArticlesRequest {
  int32 status = 1;
  string tag = 2;
  int64 author_id = 3;
  int32 limit = 4;
  int32 offset = 5;
  string sort = 6;
}

message FeedArticlesByTimeRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListCategoriesRequest {
  int32 status = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message CategoryIDRequest {
  int64 id = 1;
}

message UpsertCategoryRequest {
  int64 id = 1;
  string slug = 2;
  string name = 3;
  string description = 4;
  int32 sort = 5;
  int32 status = 6;
}

message ListTagsRequest {
  int32 limit = 1;
  string query = 2;
  int32 status = 3;
}

message AutocompleteTagsRequest {
  string query = 1;
  int32 limit = 2;
}
