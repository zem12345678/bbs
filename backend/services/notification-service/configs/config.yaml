service:
  name: bbs-notification-service
  grpcPort: 9108

app:
  name: bbs-notification-service

nacos:
  addr: "127.0.0.1"
  port: 8848
  namespaceId: bbs-local
  dataId: "bbs-notification-service.yaml"
  groupId: "BBS_LOCAL"

log:
  filename: logs/notification-service.log
  maxSize: 100
  maxBackups: 7
  maxAge: 30
  level: info
  stdout: true

postgres:
  # Override in production with BBS_NOTIFICATION_POSTGRES_DSN.
  dsn: postgres://bbs_notification_app:local_notification_pass@127.0.0.1:5432/bbs?sslmode=disable&search_path=bbs_notification
  debug: false
  max_open_conns: 1

kafka:
  # Override in production with comma-separated BBS_NOTIFICATION_KAFKA_BROKERS.
  brokers:
    - 127.0.0.1:9092
  userTopic: user.events
  articleTopic: article.events
  commentTopic: comment.events
  reactionTopic: reaction.events
  mallTopic: mall.events
  userGroupId: bbs-notification-user-consumer
  articleGroupId: bbs-notification-article-consumer
  commentGroupId: bbs-notification-comment-consumer
  reactionGroupId: bbs-notification-reaction-consumer
  mallGroupId: bbs-notification-mall-consumer

grpc:
  server:
    port: 9108
    etcdAddr:
      - "127.0.0.1:2379"
    serviceName: "bbs-notification-service"
    timeout: 10s
    # Override in production with BBS_NOTIFICATION_GRPC_SERVER_INTERNAL_AUTH_TOKEN.
    internalAuthToken: ""
  client:
    timeout: 10s
    tag: "notification"
    etcdAddr:
      - "127.0.0.1:2379"
    serverName: "bbs-notification-service"
    secure: false

trace:
  grpcEndpoint: 127.0.0.1:4317
  serviceName: bbs-notification-service
  version: local
  env: local
