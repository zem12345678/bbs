syntax = "proto3";

package bbs.notification.v1;

option go_package = "notification-service/api/proto/notificationpb;notificationpb";

service NotificationService {
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
  rpc CountUnread(CountUnreadRequest) returns (CountUnreadResponse);
  rpc MarkRead(MarkReadRequest) returns (MutationResponse);
  rpc MarkAllRead(MarkAllReadRequest) returns (MutationResponse);
  rpc GetPreferences(GetPreferencesRequest) returns (PreferencesResponse);
  rpc UpdatePreferences(UpdatePreferencesRequest) returns (PreferencesResponse);
  rpc GetWebPushConfig(GetWebPushConfigRequest) returns (WebPushConfigResponse);
  rpc RegisterWebPushSubscription(RegisterWebPushSubscriptionRequest) returns (WebPushSubscriptionResponse);
  rpc GetWebPushSubscription(GetWebPushSubscriptionRequest) returns (WebPushSubscriptionResponse);
  rpc UnregisterWebPushSubscription(UnregisterWebPushSubscriptionRequest) returns (MutationResponse);
  rpc ListWebhooks(ListWebhooksRequest) returns (WebhookListResponse);
  rpc CreateWebhook(CreateWebhookRequest) returns (WebhookResponse);
  rpc ShowWebhook(ShowWebhookRequest) returns (WebhookResponse);
  rpc UpdateWebhook(UpdateWebhookRequest) returns (WebhookResponse);
  rpc DeleteWebhook(DeleteWebhookRequest) returns (MutationResponse);
  rpc TestWebhook(TestWebhookRequest) returns (MutationResponse);
}

// This service is intentionally separate from the user-facing notification API.
// It is called by privileged internal services after their own authorization.
service InternalNotificationService {
  rpc DispatchSystemNotifications(DispatchSystemNotificationsRequest) returns (DispatchSystemNotificationsResponse);
  rpc EraseUserData(EraseUserDataRequest) returns (MutationResponse);
}

message Notification {
  int64 id = 1;
  int64 user_id = 2;
  string type = 3;
  string title = 4;
  string content = 5;
  int64 actor_id = 6;
  string entity_type = 7;
  int64 entity_id = 8;
  int64 source_id = 9;
  bool read = 10;
  int64 created_at = 11;
  int64 read_at = 12;
}

message ListNotificationsRequest {
  int64 user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
  bool unread_only = 4;
}

message ListNotificationsResponse {
  repeated Notification items = 1;
  int64 total = 2;
  int64 unread_count = 3;
}

message CountUnreadRequest {
  int64 user_id = 1;
}

message CountUnreadResponse {
  int64 count = 1;
}

message MarkReadRequest {
  int64 user_id = 1;
  int64 id = 2;
}

message MarkAllReadRequest {
  int64 user_id = 1;
}

message NotificationPreference {
  string type = 1;
  bool enabled = 2;
}

message GetPreferencesRequest {
  int64 user_id = 1;
}

message UpdatePreferencesRequest {
  int64 user_id = 1;
  repeated NotificationPreference items = 2;
}

message PreferencesResponse {
  repeated NotificationPreference items = 1;
}

message GetWebPushConfigRequest {}

message WebPushConfigResponse {
  bool enabled = 1;
  string public_key = 2;
}

message RegisterWebPushSubscriptionRequest {
  int64 user_id = 1;
  string endpoint = 2;
  string auth = 3;
  string public_key = 4;
  bool send_read_message = 5;
}

message GetWebPushSubscriptionRequest {
  int64 user_id = 1;
  string endpoint = 2;
}

message UnregisterWebPushSubscriptionRequest {
  int64 user_id = 1;
  string endpoint = 2;
}

message WebPushSubscriptionResponse {
  bool registered = 1;
  string state = 2;
  int64 user_id = 3;
  string endpoint = 4;
  bool send_read_message = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
}

message Webhook {
  int64 id = 1;
  int64 user_id = 2;
  string name = 3;
  string url = 4;
  string secret = 5;
  repeated string on = 6;
  bool active = 7;
  int64 latest_sent_at = 8;
  int32 latest_status = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
}

message ListWebhooksRequest {
  int64 user_id = 1;
}

message WebhookListResponse {
  repeated Webhook items = 1;
}

message CreateWebhookRequest {
  int64 user_id = 1;
  string name = 2;
  string url = 3;
  string secret = 4;
  repeated string on = 5;
}

message WebhookResponse {
  Webhook webhook = 1;
}

message ShowWebhookRequest {
  int64 user_id = 1;
  int64 webhook_id = 2;
}

message UpdateWebhookRequest {
  int64 user_id = 1;
  int64 webhook_id = 2;
  string name = 3;
  string url = 4;
  string secret = 5;
  repeated string on = 6;
  bool active = 7;
  bool active_set = 8;
  bool secret_set = 9;
}

message DeleteWebhookRequest {
  int64 user_id = 1;
  int64 webhook_id = 2;
}

message TestWebhookRequest {
  int64 user_id = 1;
  int64 webhook_id = 2;
  string type = 3;
  string override_url = 4;
  string override_secret = 5;
  bool override_secret_set = 6;
}

message MutationResponse {
  bool success = 1;
  string message = 2;
}

message DispatchSystemNotificationsRequest {
  repeated int64 recipient_ids = 1;
  string title = 2;
  string content = 3;
  int64 actor_id = 4;
  string idempotency_key = 5;
}

message DispatchSystemNotificationsResponse {
  int32 delivered_count = 1;
}

message EraseUserDataRequest {
  int64 user_id = 1;
  int64 deletion_job_id = 2;
  int32 policy_version = 3;
}
