name: bbs-local

services:
  # Mailpit is BBS-specific. Every stateful dependency is supplied by the host.
  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:latest}
    container_name: bbs-local-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
    networks:
      - bbs-local-net

networks:
  bbs-local-net:
    name: bbs-local-net
