service:
  name: bbs-file-service
  grpcPort: 9111

app:
  name: bbs-file-service

nacos:
  addr: "127.0.0.1"
  port: 8848
  namespaceId: bbs-local
  dataId: "bbs-file-service.yaml"
  groupId: "BBS_LOCAL"

postgres:
  dsn: postgres://bbs_file_app:local_file_pass@127.0.0.1:5432/bbs?sslmode=disable&search_path=bbs_file

storage:
  provider: minio
  endpoint: __BBS_LOCAL_MINIO_ENDPOINT__
  bucket: __BBS_LOCAL_MINIO_BUCKET__
  accessKey: __BBS_LOCAL_MINIO_ACCESS_KEY__
  secretKey: __BBS_LOCAL_MINIO_SECRET_KEY__

upstreams:
  credit: bbs-credit-service
  creditInternalAuthToken: __BBS_LOCAL_CREDIT_INTERNAL_AUTH_TOKEN__
  content: bbs-content-service
  contentInternalAuthToken: __BBS_LOCAL_CONTENT_INTERNAL_AUTH_TOKEN__
  mall: bbs-mall-service
  mallInternalAuthToken: __BBS_LOCAL_MALL_INTERNAL_AUTH_TOKEN__

grpc:
  server:
    port: 9111
    etcdAddr:
      - "127.0.0.1:2379"
    serviceName: "bbs-file-service"
    internalAuthToken: __BBS_LOCAL_FILE_INTERNAL_AUTH_TOKEN__
  client:
    etcdAddr:
      - "127.0.0.1:2379"
