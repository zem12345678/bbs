service:
  name: bbs-content-service
  grpcPort: 9103

app:
  name: bbs-content-service

nacos:
  addr: "127.0.0.1"
  port: 8848
  namespaceId: bbs-local
  dataId: "bbs-content-service.yaml"
  groupId: "BBS_LOCAL"

log:
  filename: logs/content-service.log
  maxSize: 100
  maxBackups: 7
  maxAge: 30
  level: debug
  stdout: true

trace:
  grpcEndpoint: 127.0.0.1:4317
  serviceName: bbs-content-service
  version: local
  env: local

grpc:
  server:
    port: 9103
    etcdAddr:
      - "127.0.0.1:2379"
    serviceName: "bbs-content-service"
    timeout: 10s
    internalAuthToken: __BBS_LOCAL_CONTENT_INTERNAL_AUTH_TOKEN__

postgres:
  dsn: postgres://bbs_content_app:local_content_pass@127.0.0.1:5432/bbs?sslmode=disable&search_path=bbs_content
  debug: false

redis:
  url: 127.0.0.1:6379
  addr: 127.0.0.1:6379
  dbNum: 0
  db: 0
  password: ""
  maxIdle: 10
  maxActive: 100
  idleTimeout: 10
  timeout: 5
  network: "tcp"

kafka:
  brokers:
    - 127.0.0.1:9092
  topic: article.events

upstreams:
  comment: bbs-comment-service
  commentInternalAuthToken: __BBS_LOCAL_COMMENT_INTERNAL_AUTH_TOKEN__
  mall: bbs-mall-service
  mallInternalAuthToken: __BBS_LOCAL_MALL_INTERNAL_AUTH_TOKEN__
  credit: bbs-credit-service
  creditInternalAuthToken: __BBS_LOCAL_CREDIT_INTERNAL_AUTH_TOKEN__

content:
  allowedTopicTypes:
    - topic
    - tweet
  defaultStatus: published
  maxTags: 5

outbox:
  owner: bbs-content-service
  batchSize: 20
  leaseDuration: 30s
  interval: 1s
  retryDelay: 3s
