service:
  name: bbs-user-service
  grpcPort: 9102

app:
  name: bbs-user-service

nacos:
  addr: "127.0.0.1"
  port: 8848
  namespaceId: bbs-local
  dataId: "bbs-user-service.yaml"
  groupId: "BBS_LOCAL"

log:
  filename: logs/user-service.log
  maxSize: 100
  maxBackups: 7
  maxAge: 30
  level: info
  stdout: true

postgres:
  dsn: postgres://bbs_user_app:local_user_pass@127.0.0.1:5432/bbs?sslmode=disable&search_path=bbs_user
  debug: false

redis:
  url: "127.0.0.1:6379"
  dbNum: 0
  password: ""
  maxIdle: 10
  maxActive: 100
  idleTimeout: 10
  timeout: 5
  network: "tcp"

kafka:
  brokers:
    - 127.0.0.1:9092
  topic: user.events

snowflake:
  workerId: 2

jwt:
  secret: __BBS_LOCAL_USER_JWT_SECRET__
  ttl: 168h

password:
  minLength: 8

mfa:
  encryptionKey: __BBS_LOCAL_USER_MFA_ENCRYPTION_KEY__
  issuer: BBS Community

mail:
  enabled: true
  smtpAddr: 127.0.0.1:1025
  from: noreply@bbs.local
  frontendBaseURL: http://127.0.0.1:8850
  tlsMode: none
  timeout: 10s

upstreams:
  mall: bbs-mall-service
  mallInternalAuthToken: __BBS_LOCAL_MALL_INTERNAL_AUTH_TOKEN__

grpc:
  server:
    port: 9102
    etcdAddr:
      - "127.0.0.1:2379"
    serviceName: "bbs-user-service"
    timeout: 10s
    internalAuthToken: __BBS_LOCAL_USER_INTERNAL_AUTH_TOKEN__
  client:
    timeout: 10s
    tag: "user"
    etcdAddr:
      - "127.0.0.1:2379"
    serverName: "bbs-user-service"
    secure: false

trace:
  grpcEndpoint: 127.0.0.1:4317
  serviceName: bbs-user-service
  version: local
  env: local

profile:
  defaultAvatar: ""
  defaultBackground: ""
