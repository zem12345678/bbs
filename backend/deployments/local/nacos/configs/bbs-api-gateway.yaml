service:
  name: api-gateway
  httpPort: 18080

app:
  name: api-gateway

nacos:
  addr: "127.0.0.1"
  port: 8848
  namespaceId: ""
  dataId: "bbs-api-gateway.yaml"
  groupId: "DEFAULT_GROUP"

log:
  filename: logs/api-gateway.log
  maxSize: 100
  maxBackups: 7
  maxAge: 30
  level: debug
  stdout: true

trace:
  grpcEndpoint: 127.0.0.1:4317
  serviceName: api-gateway
  version: local
  env: local

grpc:
  client:
    timeout: 10s
    tag: "api-gateway"
    etcdAddr:
      - "127.0.0.1:2379"
    serverName: "api-gateway"
    secure: false

auth:
  tokenHeader: Authorization
  tokenPrefix: Bearer
  jwtSecret: bbs-local-dev-secret

cors:
  allowedOrigins:
    - http://127.0.0.1:8850
    - http://localhost:8850
    - http://127.0.0.1:5173
    - http://localhost:5173
    - http://127.0.0.1:8848
    - http://localhost:8848
    - http://127.0.0.1:8849
    - http://localhost:8849

upstreams:
  admin: admin-service
  user: user-service
  content: content-service
  comment: comment-service
  reaction: reaction-service
  search: search-service
  feed: feed-service
  credit: credit-service
  mall: mall-service
  notification: notification-service
