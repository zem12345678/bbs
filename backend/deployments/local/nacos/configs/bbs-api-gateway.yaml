service:
  name: bbs-api-gateway
  httpPort: 18080

app:
  name: bbs-api-gateway

nacos:
  addr: "127.0.0.1"
  port: 8848
  namespaceId: bbs-local
  dataId: "bbs-api-gateway.yaml"
  groupId: "BBS_LOCAL"

log:
  filename: logs/api-gateway.log
  maxSize: 100
  maxBackups: 7
  maxAge: 30
  level: debug
  stdout: true

trace:
  grpcEndpoint: 127.0.0.1:4317
  serviceName: bbs-api-gateway
  version: local
  env: local

grpc:
  client:
    timeout: 10s
    tag: "bbs-api-gateway"
    etcdAddr:
      - "127.0.0.1:2379"
    serverName: "bbs-api-gateway"
    secure: false

auth:
  tokenHeader: Authorization
  tokenPrefix: Bearer
  jwtSecret: bbs-local-dev-secret

cors:
  allowedOrigins:
    - http://127.0.0.1:8850
    - http://localhost:8850
    - http://127.0.0.1:8851
    - http://localhost:8851
    - http://127.0.0.1:5173
    - http://localhost:5173
    - http://127.0.0.1:8848
    - http://localhost:8848
    - http://127.0.0.1:8849
    - http://localhost:8849

upstreams:
  admin: bbs-admin-service
  user: bbs-user-service
  content: bbs-content-service
  comment: bbs-comment-service
  reaction: bbs-reaction-service
  search: bbs-search-service
  feed: bbs-feed-service
  credit: bbs-credit-service
  mall: bbs-mall-service
  notification: bbs-notification-service
  file: bbs-file-service
  chat: bbs-chat-service

storage:
  endpoint: __BBS_LOCAL_MINIO_ENDPOINT__
  bucket: __BBS_LOCAL_MINIO_BUCKET__
  accessKey: __BBS_LOCAL_MINIO_ACCESS_KEY__
  secretKey: __BBS_LOCAL_MINIO_SECRET_KEY__
