service:
  name: bbs-comment-service
  grpcPort: 9104

app:
  name: bbs-comment-service

nacos:
  addr: "127.0.0.1"
  port: 8848
  namespaceId: bbs-local
  dataId: "bbs-comment-service.yaml"
  groupId: "BBS_LOCAL"

log:
  filename: logs/comment-service.log
  maxSize: 100
  maxBackups: 7
  maxAge: 30
  level: info
  stdout: true

mongo:
  uri: mongodb://admin:123456@127.0.0.1:27017/?authSource=admin
  username: admin
  password: "123456"
  endpoints:
    - 127.0.0.1:27017
  authDB: admin
  enableTrace: false
  database: bbs_comment

kafka:
  brokers:
    - 127.0.0.1:9092
  topic: comment.events

snowflake:
  workerId: 4

grpc:
  server:
    port: 9104
    etcdAddr:
      - "127.0.0.1:2379"
    serviceName: "bbs-comment-service"
    timeout: 10s
    internalAuthToken: __BBS_LOCAL_COMMENT_INTERNAL_AUTH_TOKEN__
  client:
    timeout: 10s
    tag: "comment"
    etcdAddr:
      - "127.0.0.1:2379"
    serverName: "bbs-comment-service"
    secure: false

trace:
  grpcEndpoint: 127.0.0.1:4317
  serviceName: bbs-comment-service
  version: local
  env: local

comments:
  nesting: two-level
  defaultStatus: published
