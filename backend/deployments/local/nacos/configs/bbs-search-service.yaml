service:
  name: bbs-search-service
  grpcPort: 9106

app:
  name: bbs-search-service

nacos:
  addr: "127.0.0.1"
  port: 8848
  namespaceId: bbs-local
  dataId: "bbs-search-service.yaml"
  groupId: "BBS_LOCAL"

log:
  filename: logs/search-service.log
  maxSize: 100
  maxBackups: 7
  maxAge: 30
  level: info
  stdout: true

elasticsearch:
  addresses:
    - http://127.0.0.1:9200
  indices:
    topics: bbs_topics
    articles: bbs_articles
    users: bbs_users_v2
    tags: bbs_tags

es:
  url:
    - http://127.0.0.1:9200
  enable_debug_logger: false
  indices:
    articles: bbs_articles
    topics: bbs_topics
    users: bbs_users_v2

kafka:
  brokers:
    - 127.0.0.1:9092
  articleTopic: article.events
  commentTopic: comment.events
  reactionTopic: reaction.events
  userTopic: user.events
  articleGroupId: bbs-search-indexer
  commentGroupId: bbs-search-comment-counter
  reactionGroupId: bbs-search-reaction-counter
  userGroupId: bbs-search-user-indexer

grpc:
  server:
    port: 9106
    etcdAddr:
      - "127.0.0.1:2379"
    serviceName: "bbs-search-service"
    timeout: 10s
    internalAuthToken: __BBS_LOCAL_SEARCH_INTERNAL_AUTH_TOKEN__
  client:
    timeout: 10s
    tag: "search"
    etcdAddr:
      - "127.0.0.1:2379"
    serverName: "bbs-search-service"
    secure: false

trace:
  grpcEndpoint: 127.0.0.1:4317
  serviceName: bbs-search-service
  version: local
  env: local
