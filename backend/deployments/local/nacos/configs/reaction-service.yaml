service:
  name: reaction-service
  grpcPort: 9105

postgres:
  dsn: postgres://bbs_reaction_app:local_reaction_pass@127.0.0.1:5432/bbs?sslmode=disable&search_path=bbs_reaction

redis:
  addr: 127.0.0.1:6379
  db: 0
  password: ""

kafka:
  brokers:
    - 127.0.0.1:9092
  topic: reaction.events

counter:
  redisKeyPrefix: reaction

outbox:
  pollIntervalMs: 1000
  batchSize: 100
