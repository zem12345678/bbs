service:
  name: bbs-admin-service
  grpcPort: 9114

app:
  name: bbs-admin-service

nacos:
  addr: "127.0.0.1"
  port: 8848
  namespaceId: bbs-local
  dataId: "bbs-admin-service.yaml"
  groupId: "BBS_LOCAL"

log:
  filename: logs/admin-service.log
  maxSize: 100
  maxBackups: 7
  maxAge: 30
  level: info
  stdout: true

postgres:
  dsn: postgres://bbs_admin_app:local_admin_pass@127.0.0.1:5432/bbs?sslmode=disable&search_path=bbs_admin
  debug: false

redis:
  url: "127.0.0.1:6379"
  dbNum: 0
  password: ""
  maxIdle: 10
  maxActive: 100
  idleTimeout: 10
  timeout: 5
  network: "tcp"

grpc:
  server:
    port: 9114
    etcdAddr:
      - "127.0.0.1:2379"
    serviceName: "bbs-admin-service"
    timeout: 10s
    internalAuthToken: __BBS_LOCAL_ADMIN_INTERNAL_AUTH_TOKEN__
  client:
    timeout: 10s
    tag: "admin"
    etcdAddr:
      - "127.0.0.1:2379"
    serverName: "bbs-admin-service"
    secure: false

trace:
  grpcEndpoint: 127.0.0.1:4317
  serviceName: bbs-admin-service
  version: local
  env: local

rbac:
  bootstrapAdminPrefixes:
    - admin

auth:
  jwtSecret: __BBS_LOCAL_ADMIN_JWT_SECRET__
  jwtTtl: 168h
  refreshTtl: 720h
  defaultAdminPassword: __BBS_LOCAL_ADMIN_DEFAULT_PASSWORD__
  secretEncryptionKey: __BBS_LOCAL_ADMIN_SECRET_ENCRYPTION_KEY__

upstreams:
  user: bbs-user-service
  userInternalAuthToken: __BBS_LOCAL_USER_INTERNAL_AUTH_TOKEN__
  reaction: bbs-reaction-service
  reactionInternalAuthToken: __BBS_LOCAL_REACTION_INTERNAL_AUTH_TOKEN__
  content: bbs-content-service
  contentInternalAuthToken: __BBS_LOCAL_CONTENT_INTERNAL_AUTH_TOKEN__
  comment: bbs-comment-service
  commentInternalAuthToken: __BBS_LOCAL_COMMENT_INTERNAL_AUTH_TOKEN__
  notification: bbs-notification-service
  notificationInternalAuthToken: __BBS_LOCAL_NOTIFICATION_INTERNAL_AUTH_TOKEN__
  search: bbs-search-service
  searchInternalAuthToken: __BBS_LOCAL_SEARCH_INTERNAL_AUTH_TOKEN__
