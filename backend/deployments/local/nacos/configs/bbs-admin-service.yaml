service:
  name: bbs-admin-service
  grpcPort: 9114

app:
  name: bbs-admin-service

nacos:
  addr: "127.0.0.1"
  port: 8848
  namespaceId: bbs-local
  dataId: "bbs-admin-service.yaml"
  groupId: "BBS_LOCAL"

log:
  filename: logs/admin-service.log
  maxSize: 100
  maxBackups: 7
  maxAge: 30
  level: info
  stdout: true

postgres:
  dsn: postgres://bbs_admin_app:local_admin_pass@127.0.0.1:5432/bbs?sslmode=disable&search_path=bbs_admin
  debug: false

redis:
  url: "127.0.0.1:6379"
  dbNum: 0
  password: ""
  maxIdle: 10
  maxActive: 100
  idleTimeout: 10
  timeout: 5
  network: "tcp"

grpc:
  server:
    port: 9114
    etcdAddr:
      - "127.0.0.1:2379"
    serviceName: "bbs-admin-service"
    timeout: 10s
  client:
    timeout: 10s
    tag: "admin"
    etcdAddr:
      - "127.0.0.1:2379"
    serverName: "bbs-admin-service"
    secure: false

trace:
  grpcEndpoint: 127.0.0.1:4317
  serviceName: bbs-admin-service
  version: local
  env: local

rbac:
  bootstrapAdminPrefixes:
    - admin

auth:
  jwtSecret: bbs-admin-local-dev-secret
  jwtTtl: 168h
  defaultAdminPassword: Admin123!
  secretEncryptionKey: bbs-admin-local-setting-secret

upstreams:
  user: bbs-user-service
  reaction: bbs-reaction-service
  content: bbs-content-service
  comment: bbs-comment-service
