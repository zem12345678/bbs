# Preserve the public scheme/host supplied by the trusted edge proxy. Direct
# local access has no such headers, so it falls back to this Nginx listener.
map $http_x_forwarded_proto $bbs_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_host $bbs_forwarded_host {
    default $http_x_forwarded_host;
    ""      $host;
}

map $http_x_forwarded_port $bbs_forwarded_port {
    default $http_x_forwarded_port;
    ""      $server_port;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    # Gateway accepts a 50 MiB attachment plus multipart framing.
    client_max_body_size 52m;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /config.js {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SEO documents are generated by the gateway from published public content.
    location = /robots.txt {
        proxy_pass http://bbs-api-gateway:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $bbs_forwarded_proto;
        proxy_set_header X-Forwarded-Host $bbs_forwarded_host;
        proxy_set_header X-Forwarded-Port $bbs_forwarded_port;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    location = /sitemap.xml {
        proxy_pass http://bbs-api-gateway:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $bbs_forwarded_proto;
        proxy_set_header X-Forwarded-Host $bbs_forwarded_host;
        proxy_set_header X-Forwarded-Port $bbs_forwarded_port;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    location ^~ /sitemaps/ {
        proxy_pass http://bbs-api-gateway:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $bbs_forwarded_proto;
        proxy_set_header X-Forwarded-Host $bbs_forwarded_host;
        proxy_set_header X-Forwarded-Port $bbs_forwarded_port;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    location = /api/v1/chat/ws {
        proxy_pass http://bbs-api-gateway:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $bbs_forwarded_proto;
        proxy_set_header X-Forwarded-Host $bbs_forwarded_host;
        proxy_set_header X-Forwarded-Port $bbs_forwarded_port;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://bbs-api-gateway:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $bbs_forwarded_proto;
        proxy_set_header X-Forwarded-Host $bbs_forwarded_host;
        proxy_set_header X-Forwarded-Port $bbs_forwarded_port;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    location ^~ /uploads/avatars/ {
        proxy_pass http://bbs-api-gateway:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $bbs_forwarded_proto;
        proxy_set_header X-Forwarded-Host $bbs_forwarded_host;
        proxy_set_header X-Forwarded-Port $bbs_forwarded_port;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    location ^~ /uploads/images/ {
        proxy_pass http://bbs-api-gateway:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $bbs_forwarded_proto;
        proxy_set_header X-Forwarded-Host $bbs_forwarded_host;
        proxy_set_header X-Forwarded-Port $bbs_forwarded_port;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # Never let a static fallback expose or mask private attachment keys.
    location ^~ /uploads/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
